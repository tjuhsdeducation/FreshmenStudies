<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone-Free Classrooms | WICOR English 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="wicor-lesson.css">
</head>
<body>
<script>
/* =====================================================================
   ✏️ LESSON CONTENT: Argument & Rhetorical Appeals (English 1)
   In the article:  [C] = claim   [E] = evidence   [R] = reasoning
                    {{word}} = a key term students should circle
   ===================================================================== */
const FRAMES = [ "I agree with ___ because…", "I respectfully disagree because…", "Can you clarify what you mean by…?",
                 "I'd like to build on that idea…", "What evidence do you have that…?", "I used to think ___, but now I think…" ];
const LESSON = {
  id: "eng1-phone-free",
  subject: "English 1",
  short: "English 1: Argument & Appeals",
  color: "#e8368f",
  emoji: "📵",
  eq: "How do writers use evidence and rhetorical appeals to persuade an audience?",
  targets: {"R": "I can identify the claim, evidence, and reasoning in an argumentative essay.", "W": "I can write a CER paragraph that takes a position on phones in class and cites a specific source.", "I": "I can test an author's claim with a model and explain how the results support or challenge it.", "C": "I can support my position with evidence and respond respectfully to a peer.", "O": "I can classify sentences as logos, pathos, ethos, or counterclaim."},
  title: "Silence the Phones? The Case for Phone-Free Classrooms",
  intro: "How do writers persuade us? Analyze an argument about phones in class, write your own CER, test the claim in a focus lab, debate it, and sort rhetorical appeals. Five stations, about 5–10 minutes each.",
  order: ["R", "W", "I", "C", "O"],
  stations: {

    R: {
      title: "Read & Annotate", time: "8–10 min",
      goal: "Read the argument and mark it up: underline the <b>claim</b>, highlight <b>evidence</b> and <b>reasoning</b>, circle <b>key terms</b>, and write at least one <b>margin note</b>. Notice where the author uses emotion, facts, and credibility.",
      minKeys: 4,
      gist: "In one sentence, what does the author want you to believe, and who is the author trying to persuade?",
      article: {
        title: "Silence the Phones",
        byline: "English 1 · AVID WICOR reading · Argumentative essay",
        paragraphs: [
          [ "Picture a classroom where every student is focused, no one is sneaking glances under the desk, and the only buzzing comes from a good discussion.",
            "For many teachers, that picture feels like a dream.",
            "[C] Schools should require students to put their phones away during class, because phones pull attention away from learning even when they are silent." ],
          [ "Smartphones are designed to grab our attention.",
            "Apps use alerts, streaks, and endless scrolling to keep users coming back, a strategy some critics call the {{attention economy}}.",
            "Every time a {{notification}} lights up a screen, a student's focus is split between the lesson and the phone." ],
          [ "[E] In a 2024 Pew Research Center {{survey}}, 72% of U.S. high school teachers said that students being distracted by cellphones is a major problem in their classrooms.",
            "[E] In a 2017 {{study}} at the University of Texas at Austin, participants who left their phones in another room scored better on memory and problem-solving tests than those whose phones sat silently on their desks.",
            "[E] California's Phone-Free School Act, signed in 2024, requires every school district to adopt a {{policy}} limiting student smartphone use by July 2026." ],
          [ "[R] If simply having a phone nearby drains brainpower, then the best way to protect learning is to put phones completely out of reach.",
            "[R] A clear rule also removes the daily battle between teachers and students, freeing up more time for actual teaching." ],
          [ "Some argue that students need phones for emergencies or as learning tools.",
            "Those concerns are real, but phones can be stored in backpacks or pouches and still be available in an emergency, and schools can provide laptops for research.",
            "Every student deserves a classroom where their full attention is protected." ]
        ]
      }
    },

    W: {
      title: "Write a CER Paragraph", time: "8–10 min",
      goal: "Take your own position and write a <b>Claim–Evidence–Reasoning</b> paragraph. You may agree or disagree with the author.",
      prompt: "Should our school require phones to be put away during class? Write a CER using evidence from the article.",
      parts: [
        { key: "claim", label: "Claim", sub: "Your position", starter: "Our school should / should not…",
          hint: "One sentence that takes a clear, arguable position.", checkLabel: "Claim takes a position (8+ words)",
          check: v => words(v) >= 8 && /phone/i.test(v) && /should|must|need/i.test(v) },
        { key: "evidence", label: "Evidence", sub: "Proof from the text", rows: 3, starter: "According to the article, …",
          hint: "Quote or paraphrase a <b>specific</b> fact: a statistic, a study, or a law. Name the source!",
          checkLabel: "Evidence cites a specific source or statistic",
          check: v => words(v) >= 12 && /article|text|author|according|["“]/i.test(v) && /72|pew|survey|texas|study|another room|phone-free|2024|2026|california/i.test(v) },
        { key: "reasoning", label: "Reasoning", sub: "Why it proves your claim", rows: 3, starter: "This shows that … because…",
          hint: "Explain HOW the evidence supports your position. Strong writers also answer the other side.",
          checkLabel: "Reasoning explains WHY (uses \"because\" or \"this shows\")",
          check: v => words(v) >= 15 && /because|this shows|this means|therefore|which means|so that/i.test(v) }
      ],
      minTerms: 3, minWords: 50,
      terms: [ ["distraction", /distract/i], ["attention", /attention/i], ["focus", /focus/i], ["evidence", /evidence/i],
               ["policy", /policy/i], ["survey/study", /survey|study/i], ["counterclaim", /counterclaim|some argue|others argue|opponents/i] ]
    },

    I: {
      title: "Predict, Test & Graph", time: "10 min",
      goal: "Test the author's claim like a researcher: <b>predict</b>, run the <b>focus lab</b>, graph your results, and ask a <b>Level 3 question</b>.",
      predict: {
        q: "Predict: How will the number of notifications affect how many minutes of a 30-minute study session a student actually stays focused?",
        placeholder: "If a student gets more notifications, then their focused minutes will … because …",
        options: [
          { v: "curve", label: "Focus drops fast, then levels off", d: "M14 8 C 40 42, 60 50, 106 54" },
          { v: "linear", label: "Focus drops steadily", d: "M14 8 L106 56" },
          { v: "up", label: "Focus goes up", d: "M14 56 L106 8" },
          { v: "flat", label: "No effect", d: "M14 20 L106 20" } ]
      },
      lab: {
        title: "Test it: Focus Lab",
        intro: "This <b>model</b> is based on the idea from attention research that each interruption costs time to refocus and that a nearby phone can distract even when silent. Real people vary! Record <b>at least 5 notification levels</b> for one phone location, then compare another location.",
        controls: [
          { type: "seg", id: "loc", label: "📍 Where is the phone?", options: [["desk", "On the desk"], ["bag", "In a backpack"], ["room", "In another room"]], value: "desk", short: "Phone",
            fmt: v => ({ desk: "Desk", bag: "Backpack", room: "Other room" })[v] },
          { type: "range", id: "notes", label: "🔔 Notifications during the session", min: 0, max: 12, step: 1, value: 3, short: "Alerts" } ],
        model: c => { const base = { desk: 25.5, bag: 27.9, room: 30 }[c.loc], f = { desk: 0.11, bag: 0.066, room: 0.011 }[c.loc]; return base * Math.exp(-c.notes * f); },
        noise: 0.8, digits: 0,
        x: { id: "notes", label: "Notifications during the session", min: 0, max: 12, tick: 2 },
        y: { label: "Minutes focused (out of 30)", min: 0, max: 30, tick: 5 },
        readout: "Minutes focused (out of 30)", unit: " min", yShort: "Focused min",
        group: c => ({ desk: "Phone on desk", bag: "Phone in backpack", room: "Phone in another room" })[c.loc],
        need: { distinct: 5, groups: 1 }, needLabel: "Recorded 5+ notification levels for one phone location",
        scene: `<svg viewBox="0 0 320 220" style="width:100%;display:block">
          <rect x="20" y="130" width="280" height="14" rx="4" fill="#b98b5e"/><rect x="40" y="144" width="10" height="66" fill="#a0764c"/><rect x="270" y="144" width="10" height="66" fill="#a0764c"/>
          <rect x="70" y="96" width="90" height="34" rx="3" fill="#fff" stroke="#999"/><path d="M80 106h70M80 114h60M80 122h50" stroke="#bbb" stroke-width="3"/>
          <g id="phone"><rect x="200" y="86" width="34" height="44" rx="6" fill="#1f2430"/><rect x="204" y="91" width="26" height="32" rx="3" fill="#7ad7f0"/></g>
          <g id="badge"><circle cx="232" cy="88" r="11" fill="#e8368f"/><text id="bn" x="232" y="92" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="12" fill="#fff">3</text></g>
          <text id="where" x="160" y="30" text-anchor="middle" font-family="Nunito" font-weight="800" font-size="13" fill="#5d6577"></text>
          <rect x="60" y="44" width="200" height="14" rx="7" fill="#eee"/><rect id="meter" x="60" y="44" width="150" height="14" rx="7" fill="#1aa36f"/>
          <text x="160" y="74" text-anchor="middle" font-family="Nunito" font-weight="700" font-size="11" fill="#5d6577">focus meter</text>
        </svg>`,
        draw(svg, c, mins) {
          const ph = svg.querySelector("#phone"), bd = svg.querySelector("#badge");
          ph.style.display = c.loc === "desk" ? "" : "none"; bd.style.display = c.loc === "desk" && c.notes ? "" : "none";
          svg.querySelector("#bn").textContent = c.notes;
          svg.querySelector("#where").textContent = { desk: "📱 Phone is on the desk", bag: "🎒 Phone is zipped in a backpack", room: "🚪 Phone is in another room" }[c.loc];
          const m = Math.max(0, Math.min(30, mins || 0)); svg.querySelector("#meter").setAttribute("width", Math.max(6, m / 30 * 200));
          svg.querySelector("#meter").setAttribute("fill", m > 20 ? "#1aa36f" : m > 12 ? "#e08a00" : "#d9534f");
        },
        animate(svg, c, mins, dt) {
          const bd = svg.querySelector("#badge"); svg._t = (svg._t || 0) + dt * (1 + c.notes / 3);
          bd.setAttribute("transform", `translate(232 88) scale(${1 + .12 * Math.sin(svg._t * 6)}) translate(-232 -88)`);
        }
      },
      analyze: {
        placeholder: "My graph shows that… This could be used as evidence for / against the author's claim because…",
        hint: "Explain what your graph shows and how it could be used as <b>evidence</b> for or against the article's <b>claim</b>.",
        must: /claim/i, minWords: 25, checkLabel: "Connected the graph to the claim (25+ words, uses \"claim\")",
        stems: [ "What would happen if…", "How might the results change if…", "Why do app designers…", "What if schools…" ]
      }
    },

    C: {
      title: "Philosophical Chairs", time: "5–8 min",
      goal: "Take a position, back it up with <b>evidence</b>, and respond respectfully to a classmate's argument.",
      statement: "Phones should be banned for the ENTIRE school day, including lunch and passing periods.",
      reasonStarter: "I agree / disagree because…",
      peer: { name: "Sofia", says: "If phones are bad in class, they're bad all day. A total ban is the only rule that makes sense." },
      frames: FRAMES
    },

    O: {
      title: "Organize It", time: "5–8 min",
      goal: "Sort each sentence by the <b>rhetorical appeal</b> it uses, then write a <b>summary</b> of how the author persuades.",
      sortTitle: "Sort the rhetorical appeals",
      zones: [ "🧠 Logos (logic & facts)", "❤️ Pathos (emotion)", "🎓 Ethos (credibility)", "↩️ Counterclaim" ],
      tiles: [ ["72% of high school teachers call phone distraction a major problem.", 0],
               ["Students with phones in another room scored higher on tests.", 0],
               ["Picture a classroom where every student is focused.", 1],
               ["Every student deserves a classroom where their attention is protected.", 1],
               ["As a teacher with 15 years of experience, I have seen this firsthand.", 2],
               ["As a school counselor who works with hundreds of students, I have noticed…", 2],
               ["Some argue students need phones for emergencies.", 3],
               ["Others say phones can be useful learning tools.", 3] ],
      summaryPrompt: "Write 2–3 sentences explaining how the author uses logos, pathos, and ethos to persuade the reader.",
      summaryStarter: "The author persuades readers by…"
    }
  }
};
function words(s) { return (String(s).trim().match(/[A-Za-z0-9'’%₂₆-]+/g) || []).length; }
</script>
<script src="hub-config.js?v=3"></script>
<script src="wicor-lesson.js?v=3"></script>
</body>
</html>
