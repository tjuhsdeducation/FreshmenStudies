<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linear Functions | WICOR Algebra 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="wicor-lesson.css">
</head>
<body>
<script>
/* =====================================================================
   ✏️ LESSON CONTENT: Linear Functions & Phone Plans (Algebra 1)
   In the article:  [C] = claim   [E] = evidence   [R] = reasoning
                    {{word}} = a key term students should circle
   The phone plans are made up for practice (not real companies).
   ===================================================================== */
const FRAMES = [ "I agree with ___ because…", "I respectfully disagree because the math shows…", "Can you clarify what you mean by…?",
                 "I'd like to build on that idea…", "What evidence do you have that…?", "I used to think ___, but now I think…" ];
const LESSON = {
  id: "alg-linear-plans",
  subject: "Algebra 1",
  short: "Algebra 1: Linear Functions",
  color: "#5b5fe0",
  emoji: "📈",
  eq: "How can slope and y-intercept help me make smart decisions with money?",
  targets: {"R": "I can identify the claim, evidence, and reasoning in an article about linear functions.", "W": "I can write a CER paragraph that uses calculations, slope, and y-intercept to choose the better plan.", "I": "I can graph two linear functions and find where they intersect.", "C": "I can use my graph and calculations to support my position and respond respectfully to a peer.", "O": "I can classify information as slope, y-intercept, or point of intersection."},
  title: "The Price Is Linear: Choosing a Phone Plan",
  intro: "Is the cheapest monthly fee really the best deal? Use slope, y-intercept, and graphs to find out. Five stations, about 5–10 minutes each.",
  order: ["R", "W", "I", "C", "O"],
  stations: {

    R: {
      title: "Read & Annotate", time: "8–10 min",
      goal: "Read the article and mark it up: underline the <b>claim</b>, highlight <b>evidence</b> and <b>reasoning</b>, circle <b>key terms</b>, and write at least one <b>margin note</b>.",
      minKeys: 4,
      gist: "In one sentence, what does the author want you to believe about slope and y-intercept?",
      article: {
        title: "The Price Is Linear",
        byline: "Algebra 1 · AVID WICOR reading",
        paragraphs: [
          [ "Every month, millions of people pay for phone plans, streaming services, and gym memberships without checking the math.",
            "Many of these costs follow a {{linear function}}, a rule that can be written as y = mx + b.",
            "[C] Knowing how to read slope and y-intercept can save you real money, because a linear function shows the true cost of a choice over time." ],
          [ "In y = mx + b, the {{slope}} (m) is the {{rate of change}}: how much the total goes up for each additional unit.",
            "The {{y-intercept}} (b) is the starting value: what you pay even if you use nothing at all.",
            "On a graph, the slope tells you how steep the line is, and the y-intercept tells you where the line crosses the y-axis." ],
          [ "[E] Imagine Plan A costs $20 a month plus $5 for every gigabyte of data, so its equation is y = 5x + 20.",
            "[E] Plan B costs $45 a month plus $2.50 per gigabyte, so its equation is y = 2.5x + 45.",
            "[E] If you use 4 gigabytes, Plan A costs $40 and Plan B costs $55, but if you use 16 gigabytes, Plan A costs $100 and Plan B costs only $85." ],
          [ "[R] Because Plan A has the lower starting cost but the steeper slope, it is cheaper for light users and more expensive for heavy users.",
            "[R] The two lines cross at the {{point of intersection}}, (10, 70), the exact amount of data where both plans cost the same." ],
          [ "Companies know that most people only notice the monthly fee.",
            "Learning to look for the slope is like having x-ray vision for prices." ]
        ]
      }
    },

    W: {
      title: "Write a CER Paragraph", time: "8–10 min",
      goal: "Use your annotations and some quick math to write a <b>Claim–Evidence–Reasoning</b> paragraph. Each box lights up when that part is strong.",
      prompt: "A student uses about 6 GB of data each month. Which plan should they choose, Plan A or Plan B? Use calculations, slope, and y-intercept.",
      parts: [
        { key: "claim", label: "Claim", sub: "Answer the question", starter: "The student should choose Plan …",
          hint: "One sentence that names the better plan.", checkLabel: "Claim names a plan (6+ words)",
          check: v => words(v) >= 6 && /plan a|plan b/i.test(v) },
        { key: "evidence", label: "Evidence", sub: "Show the math", rows: 3, starter: "For 6 GB, Plan A costs 5(6) + 20 = … and Plan B costs …",
          hint: "Substitute x = 6 into <b>both</b> equations and show the totals.",
          checkLabel: "Evidence shows calculations for the plans",
          check: v => words(v) >= 10 && /\d/.test(v) && /=|\$|cost/i.test(v) && /plan b|2\.5|45/i.test(v) },
        { key: "reasoning", label: "Reasoning", sub: "Why the math proves it", rows: 3, starter: "This shows that … because Plan A's slope…",
          hint: "Explain using <b>slope</b> and <b>y-intercept</b> why one plan is cheaper at 6 GB.",
          checkLabel: "Reasoning explains WHY using slope or y-intercept",
          check: v => words(v) >= 15 && /because|this shows|this means|therefore|which means|so that/i.test(v) && /slope|intercept|rate of change|starting/i.test(v) }
      ],
      minTerms: 2, minWords: 45,
      terms: [ ["slope", /slope/i], ["y-intercept", /intercept/i], ["rate of change", /rate of change/i], ["linear", /linear/i],
               ["equation", /equation/i], ["intersection", /intersect/i], ["per gigabyte", /per (gb|gigabyte)/i] ]
    },

    I: {
      title: "Predict, Calculate & Graph", time: "10 min",
      goal: "Make a <b>prediction</b>, test it with the <b>plan calculator</b>, graph both plans, and ask a <b>Level 3 question</b>.",
      predict: {
        q: "Predict: Which plan will be cheaper for someone who uses a LOT of data, like 18 GB a month?",
        placeholder: "If someone uses a lot of data, then Plan … will be cheaper because …",
        options: [
          { v: "A", label: "Plan A (lower monthly fee)", d: "M14 52 L106 8" },
          { v: "B", label: "Plan B (lower cost per GB)", d: "M14 38 L106 20" },
          { v: "same", label: "They cost the same", d: "M14 45 L106 14 M14 40 L106 19" },
          { v: "unknown", label: "Can't tell without a phone", d: "M14 34 L106 34" } ]
      },
      lab: {
        title: "Test it: Phone Plan Calculator",
        intro: "Pick a plan and an amount of data, then record the monthly cost. Record <b>at least 4 data amounts for BOTH plans</b> to draw two lines. Where do they cross?",
        controls: [
          { type: "seg", id: "plan", label: "📱 Plan", options: [["A", "Plan A: $20 + $5/GB"], ["B", "Plan B: $45 + $2.50/GB"]], value: "A", short: "Plan" },
          { type: "range", id: "gb", label: "📶 Data used", min: 0, max: 20, step: 1, value: 6, unit: " GB", short: "Data" } ],
        model: c => c.plan === "A" ? 20 + 5 * c.gb : 45 + 2.5 * c.gb,
        noise: 0, digits: 2, prefix: "$",
        x: { id: "gb", label: "Data used (GB)", min: 0, max: 20, tick: 4 },
        y: { label: "Monthly cost ($)", min: 0, max: 120, tick: 20 },
        readout: "Monthly bill", yShort: "Cost",
        group: c => "Plan " + c.plan,
        need: { distinct: 4, groups: 2 }, needLabel: "Recorded 4+ data amounts for BOTH plans",
        scene: `<svg viewBox="0 0 320 220" style="width:100%;display:block">
          <rect x="105" y="10" width="110" height="200" rx="18" fill="#1f2430"/>
          <rect x="113" y="28" width="94" height="160" rx="8" fill="#eef1f6"/>
          <circle cx="160" cy="198" r="5" fill="#555"/>
          <text x="160" y="52" text-anchor="middle" font-family="Nunito" font-weight="800" font-size="12" fill="#5d6577">MONTHLY BILL</text>
          <text id="pl" x="160" y="76" text-anchor="middle" font-family="Fredoka, Nunito" font-weight="700" font-size="16" fill="#5b5fe0">Plan A</text>
          <text id="eq" x="160" y="98" text-anchor="middle" font-family="Nunito" font-weight="800" font-size="12" fill="#1f2430">y = 5x + 20</text>
          <text id="sub" x="160" y="120" text-anchor="middle" font-family="Nunito" font-weight="700" font-size="11" fill="#5d6577">5(6) + 20</text>
          <text id="tot" x="160" y="158" text-anchor="middle" font-family="Fredoka, Nunito" font-weight="700" font-size="28" fill="#1f2430">$50</text>
          <rect id="bar" x="125" y="168" width="70" height="8" rx="4" fill="#5b5fe0"/>
        </svg>`,
        draw(svg, c) {
          const A = c.plan === "A", tot = A ? 20 + 5 * c.gb : 45 + 2.5 * c.gb;
          svg.querySelector("#pl").textContent = "Plan " + c.plan;
          svg.querySelector("#pl").setAttribute("fill", A ? "#5b5fe0" : "#f05a28");
          svg.querySelector("#eq").textContent = A ? "y = 5x + 20" : "y = 2.5x + 45";
          svg.querySelector("#sub").textContent = A ? `5(${c.gb}) + 20` : `2.5(${c.gb}) + 45`;
          svg.querySelector("#tot").textContent = "$" + tot.toFixed(2);
          svg.querySelector("#bar").setAttribute("width", Math.max(4, tot / 120 * 70));
          svg.querySelector("#bar").setAttribute("fill", A ? "#5b5fe0" : "#f05a28");
        }
      },
      analyze: {
        placeholder: "The lines cross at about ___ GB. Plan A is cheaper when… because its slope…",
        hint: "Explain where the lines cross and why, using the words <b>slope</b> and <b>y-intercept</b>.",
        must: /slope/i, minWords: 25, checkLabel: "Analyzed the graph (25+ words, uses \"slope\")",
        stems: [ "What would happen if Plan B…", "How would the graph change if…", "What if a company added…", "Predict which plan…" ]
      }
    },

    C: {
      title: "Philosophical Chairs", time: "5–8 min",
      goal: "Take a position, back it up with <b>your graph and calculations</b>, and respond respectfully to a classmate's argument.",
      statement: "The plan with the lowest monthly fee is always the best deal.",
      reasonStarter: "I agree / disagree because when I graphed both plans, I noticed…",
      peer: { name: "Ava", says: "Plan A is only $20 a month, so it's obviously the cheapest choice for everyone." },
      frames: FRAMES
    },

    O: {
      title: "Organize It", time: "5–8 min",
      goal: "Sort each piece of information into the right part of a <b>linear function</b>, then write a <b>summary</b>.",
      sortTitle: "Parts of a linear function",
      zones: [ "📐 Slope (rate of change)", "🎯 y-intercept (starting value)", "✖️ Point of intersection" ],
      tiles: [ ["$5 per gigabyte", 0], ["$2.50 per gigabyte", 0], ["$3 per mile in a taxi", 0], ["$15 per hour at a job", 0],
               ["$20 monthly fee", 1], ["$45 monthly fee", 1], ["$4 base fare in a taxi", 1],
               ["(10, 70)", 2], ["Where both plans cost the same", 2] ],
      summaryPrompt: "Use your organizer to write a 2–3 sentence summary of how slope and y-intercept help you compare two choices.",
      summaryStarter: "In a linear function, the slope tells…"
    }
  }
};
function words(s) { return (String(s).trim().match(/[A-Za-z0-9'’%₂₆-]+/g) || []).length; }
</script>
<script src="hub-config.js?v=3"></script>
<script src="wicor-lesson.js?v=3"></script>
</body>
</html>
