<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reaction Rates | WICOR Chemistry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="wicor-lesson.css">
</head>
<body>
<script>
/* =====================================================================
   ✏️ LESSON CONTENT: Reaction Rates & Collision Theory (Chemistry)
   In the article:  [C] = claim   [E] = evidence   [R] = reasoning
                    {{word}} = a key term students should circle
   ===================================================================== */
const FRAMES = [ "I agree with ___ because…", "I respectfully disagree because the data showed…", "Can you clarify what you mean by…?",
                 "I'd like to build on that idea…", "What evidence do you have that…?", "I used to think ___, but now I think…" ];
const LESSON = {
  id: "chem-reaction-rates",
  subject: "Chemistry",
  short: "Chemistry: Reaction Rates",
  color: "#2b7de9",
  emoji: "⚗️",
  eq: "How can people control how fast chemical reactions happen?",
  targets: {"R": "I can identify the claim, evidence, and reasoning in an article about collision theory.", "W": "I can write a CER paragraph that uses collision theory to explain why cold slows food spoilage.", "I": "I can predict, test, and graph how temperature affects reaction time.", "C": "I can use lab evidence to support my position and respond respectfully to a peer.", "O": "I can classify real-life examples by the factor that changes reaction rate."},
  title: "Collision Course: Why Cold Keeps Food Fresh",
  intro: "Why does milk spoil on the counter but last for days in the fridge? Read, write, experiment, debate, and organize your way through collision theory. Five stations, about 5–10 minutes each.",
  order: ["R", "W", "I", "C", "O"],
  stations: {

    R: {
      title: "Read & Annotate", time: "8–10 min",
      goal: "Read the article and mark it up: underline the <b>claim</b>, highlight <b>evidence</b> and <b>reasoning</b>, circle <b>key terms</b>, and write at least one <b>margin note</b>.",
      minKeys: 4,
      gist: "In one sentence, what does the author want you to believe about temperature and chemical reactions?",
      article: {
        title: "Collision Course",
        byline: "Chemistry · AVID WICOR reading",
        paragraphs: [
          [ "Leave a carton of milk on the counter overnight and it spoils; keep it in the refrigerator and it lasts for days.",
            "The difference comes down to {{reaction rate}}, the speed at which a chemical reaction happens.",
            "[C] Controlling temperature is one of the most powerful ways people control chemical reactions, because temperature changes how often and how hard particles collide." ],
          [ "According to {{collision theory}}, particles must run into each other in order to react.",
            "Not every collision works: particles must hit with enough energy, called the {{activation energy}}, and in the right direction.",
            "Heating a substance makes its particles move faster, so they collide more often and with more energy." ],
          [ "[E] Chemists use a rule of thumb that many reactions roughly double in speed for every 10 °C increase in temperature.",
            "[E] Food safety experts warn that bacteria grow fastest between 40 °F and 140 °F, a range the U.S. Department of Agriculture calls the \"Danger Zone,\" which is why refrigerators should stay at or below 40 °F.",
            "[E] Even a glow stick shows the effect: dropped into hot water it glows brighter but fades sooner, while in a freezer its glow is dim but lasts much longer." ],
          [ "[R] Because temperature directly controls the speed and energy of particle collisions, raising or lowering it lets people speed up useful reactions or slow down harmful ones.",
            "[R] That is why we cook food with heat but store leftovers in the cold." ],
          [ "Temperature is not the only factor.",
            "Increasing {{surface area}}, such as crushing a tablet into powder, exposes more particles to collisions, and a {{catalyst}} speeds up a reaction by lowering the activation energy without being used up.",
            "Every time you light a stove, chill a drink, or chew your food, you are using collision theory." ]
        ]
      }
    },

    W: {
      title: "Write a CER Paragraph", time: "8–10 min",
      goal: "Use your annotations to write a <b>Claim–Evidence–Reasoning</b> paragraph. Each box lights up when that part is strong.",
      prompt: "Why should leftovers go into the refrigerator instead of staying on the counter? Use collision theory and evidence from the article.",
      parts: [
        { key: "claim", label: "Claim", sub: "Answer the question", starter: "Leftovers should go in the refrigerator because…",
          hint: "One sentence that directly answers the prompt.", checkLabel: "Claim answers the question (8+ words)",
          check: v => words(v) >= 8 && /refrigerat|fridge|cold|temperature|leftover/i.test(v) },
        { key: "evidence", label: "Evidence", sub: "Proof from the text", rows: 3, starter: "According to the article, …",
          hint: "Quote or paraphrase a <b>specific fact</b> from the article, like the Danger Zone or the 10 °C rule.",
          checkLabel: "Evidence cites the article with a specific fact",
          check: v => words(v) >= 12 && /article|text|author|according|["“]/i.test(v) && /40|danger zone|double|10 ?°|bacteria|glow stick|department of agriculture|usda/i.test(v) },
        { key: "reasoning", label: "Reasoning", sub: "Why it proves your claim", rows: 3, starter: "This shows that … because particles…",
          hint: "Explain HOW the evidence proves your claim. Connect it to particles and collisions.",
          checkLabel: "Reasoning explains WHY (uses \"because\" or \"this shows\")",
          check: v => words(v) >= 15 && /because|this shows|this means|therefore|which means|so that/i.test(v) }
      ],
      minTerms: 3, minWords: 50,
      terms: [ ["collision", /collid|collision/i], ["particles", /particle/i], ["reaction rate", /reaction rate|rate/i], ["temperature", /temperature/i],
               ["activation energy", /activation energy/i], ["bacteria", /bacteri/i], ["energy", /energy/i] ]
    },

    I: {
      title: "Predict, Test & Graph", time: "10 min",
      goal: "Make a <b>prediction</b>, test it in a <b>virtual lab</b>, graph your data, and ask a <b>Level 3 question</b>.",
      predict: {
        q: "Predict: How will WATER TEMPERATURE affect the time it takes a fizzing tablet to dissolve?",
        placeholder: "If the water temperature increases, then the time to dissolve will … because …",
        options: [
          { v: "curve", label: "Time drops fast, then levels off", d: "M14 10 C 40 52, 60 56, 106 58" },
          { v: "linear", label: "Time drops in a straight line", d: "M14 10 L106 56" },
          { v: "up", label: "Time increases", d: "M14 56 L106 10" },
          { v: "flat", label: "No change", d: "M14 34 L106 34" } ]
      },
      lab: {
        title: "Test it: Fizzing Tablet Lab",
        intro: "Drop a fizzing antacid tablet into water and time how long it takes to fully react. Test <b>at least 5 different temperatures</b> while keeping the tablet form the same. Then try crushing it!",
        controls: [
          { type: "range", id: "temp", label: "🌡️ Water temperature", min: 0, max: 60, step: 5, value: 20, unit: " °C", short: "Temp" },
          { type: "seg", id: "form", label: "💊 Tablet form", options: [["whole", "Whole tablet"], ["crushed", "Crushed powder"]], value: "whole", short: "Form" } ],
        /* science model: rate roughly doubles every +10 °C; crushing increases surface area */
        model: c => 60 * Math.pow(2, -(c.temp - 20) / 10) * (c.form === "crushed" ? 0.4 : 1),
        noise: 2, digits: 0, y: { label: "Time to dissolve (s)", min: 1, max: 250, tick: 50 },
        x: { id: "temp", label: "Water temperature (°C)", min: 0, max: 60, tick: 10 },
        readout: "Time to fully dissolve", unit: " s", yShort: "Time (s)",
        group: c => c.form === "crushed" ? "Crushed powder" : "Whole tablet",
        need: { distinct: 5, groups: 1 }, needLabel: "Recorded 5+ different temperatures with the same tablet form",
        scene: `<svg viewBox="0 0 320 220" style="width:100%;display:block">
          <rect x="18" y="40" width="16" height="150" rx="8" fill="#eee" stroke="#999" stroke-width="2"/>
          <rect id="therm" x="21" y="120" width="10" height="68" rx="5" fill="#e8573f"/>
          <circle cx="26" cy="196" r="12" fill="#e8573f" stroke="#999" stroke-width="2"/>
          <text id="tlabel" x="44" y="50" font-family="Nunito" font-weight="800" font-size="13" fill="#5d6577">20 °C</text>
          <path d="M95 50 v150 a10 10 0 0 0 10 10 h150 a10 10 0 0 0 10 -10 v-150" fill="none" stroke="#8fb8d8" stroke-width="4"/>
          <rect id="water" x="99" y="80" width="162" height="126" rx="6" fill="#bfe3fa" opacity=".85"/>
          <g id="parts"></g><g id="bub"></g>
          <g id="tab"><rect x="160" y="186" width="40" height="14" rx="6" fill="#fff" stroke="#9aa" stroke-width="2"/></g>
          <text x="180" y="36" text-anchor="middle" font-family="Nunito" font-weight="800" font-size="12" fill="#5d6577">water particles speed up as they heat</text>
        </svg>`,
        draw(svg, c) {
          const h = 10 + c.temp / 60 * 100;
          svg.querySelector("#therm").setAttribute("y", 188 - h); svg.querySelector("#therm").setAttribute("height", h);
          svg.querySelector("#tlabel").textContent = c.temp + " °C";
          svg.querySelector("#water").setAttribute("fill", `hsl(${200 - c.temp * 2.6}, 75%, ${84 - c.temp * .12}%)`);
          svg.querySelector("#tab").innerHTML = c.form === "crushed"
            ? Array.from({ length: 14 }, (_, i) => `<circle cx="${150 + (i * 37) % 62}" cy="${192 + (i * 13) % 12}" r="3" fill="#fff" stroke="#9aa"/>`).join("")
            : `<rect x="160" y="186" width="40" height="14" rx="6" fill="#fff" stroke="#9aa" stroke-width="2"/>`;
        },
        animate(svg, c, time, dt) {
          const NS = "http://www.w3.org/2000/svg", g = svg.querySelector("#parts"), b = svg.querySelector("#bub");
          if (!svg._p) {
            svg._p = Array.from({ length: 16 }, () => { const el = document.createElementNS(NS, "circle"); el.setAttribute("r", 3.5); el.setAttribute("fill", "#2b7de9"); el.setAttribute("opacity", ".55"); g.appendChild(el);
              return { el, x: 105 + Math.random() * 150, y: 86 + Math.random() * 110, a: Math.random() * 6.28 }; });
            svg._b = []; svg._acc = 0;
          }
          const sp = 20 + c.temp * 3;
          svg._p.forEach(p => { p.x += Math.cos(p.a) * sp * dt; p.y += Math.sin(p.a) * sp * dt;
            if (p.x < 104 || p.x > 256) { p.a = Math.PI - p.a; p.x = Math.min(256, Math.max(104, p.x)); }
            if (p.y < 86 || p.y > 200) { p.a = -p.a; p.y = Math.min(200, Math.max(86, p.y)); }
            p.el.setAttribute("cx", p.x); p.el.setAttribute("cy", p.y); });
          svg._acc += dt * (600 / Math.max(4, time || 60));
          while (svg._acc >= 1) { svg._acc--; const el = document.createElementNS(NS, "circle"); const x = 158 + Math.random() * 44;
            el.setAttribute("r", 2 + Math.random() * 2); el.setAttribute("fill", "#fff"); el.setAttribute("stroke", "#7fb7e0"); b.appendChild(el); svg._b.push({ el, x, y: 186 }); }
          for (let i = svg._b.length - 1; i >= 0; i--) { const q = svg._b[i]; q.y -= 60 * dt; q.el.setAttribute("cx", q.x); q.el.setAttribute("cy", q.y); if (q.y < 84) { q.el.remove(); svg._b.splice(i, 1); } }
        }
      },
      analyze: {
        placeholder: "My graph shows that as the temperature increased, the time to dissolve… This happened because the particles…",
        hint: "Describe the <b>shape</b> of your graph and explain it using <b>collision theory</b> (use the word <b>collide</b> or <b>collision</b>).",
        must: /collid|collision/i, minWords: 25, checkLabel: "Analyzed the graph (25+ words, uses \"collision\")",
        stems: [ "What would happen if…", "How would the results change if…", "Predict what would happen to…", "Why might a crushed tablet…" ]
      }
    },

    C: {
      title: "Philosophical Chairs", time: "5–8 min",
      goal: "Take a position, back it up with <b>evidence from your lab</b>, and respond respectfully to a classmate's argument.",
      statement: "Restaurants should freeze ALL of their food until the moment it is cooked, because colder is always better.",
      reasonStarter: "I agree / disagree because when I tested temperature in the lab, I noticed…",
      peer: { name: "Jordan", says: "Colder always means slower reactions, so freezing everything is the best way to keep every food safe and tasty." },
      frames: FRAMES
    },

    O: {
      title: "Organize It", time: "5–8 min",
      goal: "Sort real-life examples into a <b>graphic organizer</b> of the four factors that control reaction rate, then write a <b>summary</b>.",
      sortTitle: "What controls reaction rate?",
      zones: [ "🌡️ Temperature", "🧩 Surface Area", "🧪 Concentration", "⚡ Catalyst" ],
      tiles: [ ["Refrigerating leftovers", 0], ["Glow stick in hot water", 0], ["Cooking food on a stove", 0],
               ["Crushing a tablet into powder", 1], ["Kindling burns faster than a log", 1], ["Chewing your food", 1],
               ["Using a stronger acid", 2], ["Adding more reactant particles", 2],
               ["Enzymes in your saliva", 3], ["Catalytic converter in a car", 3] ],
      summaryPrompt: "Use your organizer to write a 2–3 sentence summary of what controls how fast a chemical reaction happens.",
      summaryStarter: "The rate of a chemical reaction depends on…"
    }
  }
};
function words(s) { return (String(s).trim().match(/[A-Za-z0-9'’%₂₆-]+/g) || []).length; }
</script>
<script src="hub-config.js?v=3"></script>
<script src="wicor-lesson.js?v=3"></script>
</body>
</html>
