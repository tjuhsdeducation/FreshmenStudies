/* ---------- 📖 DISCUSSION SOURCES: what students read before they post ----------
   ✏️ Each discussion id has: type (Article, Data, Chart, Timeline…), title, html (the reading),
      cite (where it comes from), and keys (words/numbers that show a post used the source). */
const barChart=(title,rows,unit,max,color)=>`<svg viewBox="0 0 460 ${60+rows.length*44}" role="img" aria-label="${title}" style="width:100%;max-width:560px;display:block">
  <text x="0" y="18" font-family="Nunito" font-weight="800" font-size="14" fill="#1f2430">${title}</text>
  ${rows.map(([l,v],i)=>`<text x="0" y="${56+i*44}" font-family="Nunito" font-weight="700" font-size="12" fill="#1f2430">${l}</text>
  <rect x="170" y="${40+i*44}" width="${Math.max(4,v/max*230)}" height="24" rx="6" fill="${color}"/>
  <text x="${178+v/max*230}" y="${57+i*44}" font-family="Nunito" font-weight="900" font-size="13" fill="#1f2430">${unit==='$'?'$'+v.toLocaleString():v+unit}</text>`).join('')}</svg>`;
const DSRC={
 'college-ready':{type:'Article + data',title:'Getting In vs. Getting Through',keys:['6 in 10','six in ten','six years','60%','office hours','nces','national center','persist','time management'],
  html:`<p>Getting accepted to college is a big goal, but finishing is a different challenge. According to the National Center for Education Statistics, only about <b>6 in 10</b> students who start at a four-year college earn a bachelor’s degree within <b>six years</b>.</p>
   <p>Researchers who study college success point out that grades in high school matter, but so do habits that are harder to see on a transcript: managing your own time, asking for help early (for example, going to a professor’s <b>office hours</b>), keeping organized notes, and continuing after a setback. In college, no one checks your binder or reminds you about a deadline. Students who already practice these habits are more likely to <b>persist</b> when classes get hard.</p>`,
  cite:'Source: National Center for Education Statistics (NCES), undergraduate graduation rates; summary written for AVID discussion.'},
 'productive-struggle':{type:'Article',title:'Why Struggling Can Help You Learn',keys:['desirable difficult','bjork','dweck','growth mindset','quizzing','spacing','information about what to try','productive struggle'],
  html:`<p>It feels like learning should be smooth and easy. But psychologist <b>Robert Bjork</b> found that some challenges actually make learning stick. He calls them <b>“desirable difficulties.”</b> Quizzing yourself instead of rereading, spacing out study sessions, and mixing different types of problems all feel harder in the moment, yet they lead to stronger long-term memory.</p>
   <p>Psychologist <b>Carol Dweck</b> describes a <b>growth mindset</b>: the belief that abilities can grow with effort, good strategies, and help from others. Students with a growth mindset tend to see a <b>mistake</b> as information about what to try next, not as proof that they are “bad at” something.</p>
   <p>The key word is <i>productive</i>. Struggle helps when you keep trying with a strategy, such as asking a specific question, checking an example, or bringing a point of confusion to tutorials. Struggling with no strategy just leads to frustration.</p>`,
  cite:'Sources: R. A. Bjork, research on “desirable difficulties” (UCLA); C. S. Dweck, Mindset (2006). Summary written for AVID discussion.'},
 'phones-class':{type:'Chart + law',title:'What Teachers Say About Phones',keys:['72','33','6%','6 percent','pew','phone-free','2026','3216'],
  html:`${barChart('Teachers who say phone distraction is a MAJOR problem in their classroom',[['High school teachers',72],['Middle school teachers',33],['Elementary teachers',6]],'%',100,'#e8368f')}
   <p style="margin-top:10px">In 2024, California passed the <b>Phone-Free School Act</b>, which requires every school district to adopt a policy limiting student smartphone use by <b>July 2026</b>. Districts can decide the details, such as whether phones are stored in backpacks, in pouches, or turned in at the door.</p>`,
  cite:'Sources: Pew Research Center survey of U.S. public K–12 teachers (2024); California Assembly Bill 3216, Phone-Free School Act (2024).'},
 'later-start':{type:'Data + recommendations',title:'Teens, Sleep, and School Start Times',keys:['8:30','8 to 10','8–10','7 in 10','seven in ten','aap','pediatrics','cdc','circadian','sb 328','328'],
  html:`<table class="dtab"><tr><th>Fact</th><th>Source</th></tr>
   <tr><td>Teens ages 13–18 need <b>8 to 10 hours</b> of sleep per night.</td><td>American Academy of Sleep Medicine</td></tr>
   <tr><td>About <b>7 in 10</b> U.S. high school students do not get enough sleep on school nights.</td><td>Centers for Disease Control and Prevention (CDC)</td></tr>
   <tr><td>Middle and high schools should start <b>no earlier than 8:30 a.m.</b></td><td>American Academy of Pediatrics (2014 policy)</td></tr>
   <tr><td>Since 2022, most California public high schools may not start regular classes before <b>8:30 a.m.</b></td><td>California Senate Bill 328</td></tr></table>
   <p style="margin-top:10px">During adolescence, the body’s internal clock (the <b>circadian</b> rhythm) shifts later, so many teens do not feel sleepy until 11 p.m. or later. Critics of later start times point to challenges with bus schedules, after-school sports, and parents’ work schedules.</p>`,
  cite:'Sources: AASM sleep duration recommendations; CDC Youth Risk Behavior Survey data; AAP policy statement (2014); CA SB 328 (2019, effective 2022).'},
 'invention':{type:'Timeline',title:'Five Inventions That Changed the World',keys:['1440','1450','gutenberg','1769','watt','1796','jenner','smallpox','1980','1876','graham bell','1969','arpanet','1991','world wide web','industrial revolution','world health organization'],
  html:`<svg viewBox="0 0 560 210" role="img" aria-label="Timeline of five inventions" style="width:100%;display:block">
   <line x1="20" y1="100" x2="540" y2="100" stroke="#1f2430" stroke-width="3"/>
   ${[[40,'c. 1440s','Printing press','Gutenberg’s movable type'],[150,'1769','Steam engine','James Watt’s improved design'],[260,'1796','Vaccine','Edward Jenner: smallpox'],[370,'1876','Telephone','Alexander Graham Bell'],[480,'1969 / 1991','Internet','ARPANET / World Wide Web']].map(([x,y,n,d],i)=>`
   <circle cx="${x}" cy="100" r="9" fill="#e08a00"/><text x="${x}" y="${i%2?140:72}" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="13" fill="#1f2430">${y}</text>
   <text x="${x}" y="${i%2?160:52}" text-anchor="middle" font-family="Nunito" font-weight="800" font-size="12" fill="#e08a00">${n}</text>
   <text x="${x}" y="${i%2?176:36}" text-anchor="middle" font-family="Nunito" font-weight="600" font-size="10" fill="#5d6577">${d}</text>`).join('')}</svg>
   <ul style="margin:8px 0 0;padding-left:20px"><li><b>Printing press:</b> books could be copied quickly, spreading ideas and literacy across Europe.</li>
   <li><b>Steam engine:</b> powered factories, trains, and ships during the Industrial Revolution.</li>
   <li><b>Vaccines:</b> smallpox, which killed millions, was declared eradicated by the World Health Organization in <b>1980</b>.</li>
   <li><b>Telephone:</b> people could talk instantly across long distances for the first time.</li>
   <li><b>Internet:</b> connects billions of people to information and each other.</li></ul>`,
  cite:'Sources: dates from standard world history references; smallpox eradication declared by the World Health Organization (1980).'},
 'math-life':{type:'Data table',title:'The Math of Saving $5 a Day',keys:['$5','1,825','1825','18,250','22,9','interest','percent','5%','linear','exponential','compound'],
  html:`<p>Imagine saving <b>$5 a day</b>. That is $5 × 365 = <b>$1,825 a year</b>. The table compares keeping the money in a jar with putting it in an account that earns <b>5% interest</b> per year (compounded once a year, deposit made at the end of each year).</p>
   <table class="dtab"><tr><th>Year</th><th>In a jar</th><th>Earning 5% interest</th></tr>
   <tr><td>1</td><td>$1,825</td><td>$1,825</td></tr><tr><td>2</td><td>$3,650</td><td>$3,741</td></tr><tr><td>5</td><td>$9,125</td><td>$10,084</td></tr><tr><td>10</td><td>$18,250</td><td>$22,955</td></tr></table>
   <p style="margin-top:8px">The jar grows in a <b>linear</b> pattern (the same amount each year). The account grows faster over time because you earn interest on your interest: <b>compound</b> growth.</p>`,
  cite:'Calculations: deposits of $1,825 at the end of each year, 5% annual interest compounded yearly (future value of an annuity). Rounded to the nearest dollar.'},
 'four-year':{type:'Chart',title:'Education, Earnings, and Unemployment',keys:['1,493','1493','1,058','1058','899','2.2','2.7','3.9','bls','labor statistics','electrician','61,','apprentice','median'],
  html:`${barChart('Median weekly earnings by education (2023)',[['High school diploma',899],['Associate degree',1058],['Bachelor’s degree',1493]],'$',1600,'#e0408a')}
   <table class="dtab" style="margin-top:8px"><tr><th>Education</th><th>Unemployment rate (2023)</th></tr><tr><td>High school diploma</td><td>3.9%</td></tr><tr><td>Associate degree</td><td>2.7%</td></tr><tr><td>Bachelor’s degree</td><td>2.2%</td></tr></table>
   <p style="margin-top:8px">These are <b>medians</b>, so many people earn more or less. Some skilled trades pay well without a four-year degree. For example, electricians, who usually train through paid <b>apprenticeships</b>, had a median pay of about <b>$61,000</b> a year in 2023.</p>`,
  cite:'Source: U.S. Bureau of Labor Statistics, “Education pays” (2023 data) and Occupational Outlook Handbook: Electricians (May 2023).'},
 'open-topic':{type:'Reading guide',title:'Read Like a Fact-Checker: SIFT',keys:['sift','source','investigate','trace','coverage','author','evidence','article'],
  html:`<p>Your teacher will share today’s article, video, or source in class. Before you post, read it like a professional fact-checker using <b>SIFT</b>:</p>
   <ol><li><b>S</b>top: notice your first reaction before you share or decide.</li><li><b>I</b>nvestigate the source: who made it, and why?</li><li><b>F</b>ind better coverage: what do other trusted sources say?</li><li><b>T</b>race claims, quotes, and numbers back to where they came from.</li></ol>
   <p>In your post, name the source and use at least one specific detail from it.</p>`,
  cite:'SIFT method: Mike Caulfield, Washington State University, “SIFT (The Four Moves).”'},
'ai-schoolwork':{type:'Chart + two viewpoints',title:'Teens, ChatGPT, and Schoolwork',keys:['26%','26 percent','13%','13 percent','pew','double','research new topics','writing essays','study aid'],
  html:`${barChart('U.S. teens (13–17) who have used ChatGPT for schoolwork',[['2023',13],['2024 (published 2025)',26]],'%',100,'#e8368f')}
   <p style="margin-top:10px">In a survey published in <b>January 2025</b>, the <b>Pew Research Center</b> found that <b>26%</b> of U.S. teens ages 13 to 17 said they had used ChatGPT for schoolwork. That is <b>double</b> the 13% who said so in 2023. Most teens said it is acceptable to use ChatGPT to <b>research new topics</b>, but far fewer said it is acceptable to use it for <b>writing essays</b>.</p>
   <table class="dtab"><tr><th>Viewpoint A: A study aid</th><th>Viewpoint B: Skipping the thinking</th></tr>
   <tr><td>AI can explain a confusing idea in a new way, quiz you before a test, or help you brainstorm, like a tutor available any time. Used this way, it can help students who do not have someone at home to ask.</td>
   <td>Writing and problem solving are how your brain learns. If a chatbot writes the essay or solves the problem, you get the grade but skip the learning. AI can also give answers that sound confident but are wrong.</td></tr></table>`,
  cite:'Source: Pew Research Center, survey of U.S. teens ages 13–17 on ChatGPT and schoolwork (January 2025). Viewpoints summarized for AVID discussion.'},
 'social-media-16':{type:'Article + two viewpoints',title:'Too Young for Social Media?',keys:['australia','under 16','under-16','december 10','2025','surgeon general','2023','advisory','mental health','enforce'],
  html:`<p>On <b>December 10, 2025</b>, a law in <b>Australia</b> took effect that bans children <b>under 16</b> from having accounts on major social media platforms. The platforms, not parents or kids, are responsible for keeping under-16 users off.</p>
   <p>In the United States, the <b>U.S. Surgeon General</b> released an <b>advisory in 2023</b> that raised concerns about social media and youth <b>mental health</b>, and called for more research and stronger protections for young users. No national age ban like Australia’s exists in the U.S.</p>
   <table class="dtab"><tr><th>Viewpoint A: Protect teens</th><th>Viewpoint B: Keep the connection</th></tr>
   <tr><td>Teens’ brains are still developing, and apps are designed to keep people scrolling. A clear age rule takes pressure off kids and parents because “everyone else is on it” is no longer true.</td>
   <td>Social media helps teens stay connected to friends, family, and communities, including teens who feel alone at school. It is also a place for free expression. Bans may be hard to <b>enforce</b>, since users can lie about their age, and checking IDs raises privacy concerns.</td></tr></table>`,
  cite:'Sources: Australia’s social media minimum age law (in effect December 10, 2025); U.S. Surgeon General’s Advisory on Social Media and Youth Mental Health (2023). Viewpoints summarized for AVID discussion.'},
 'vote-at-16':{type:'Timeline + data table',title:'Lowering the Voting Age: Then and Now',keys:['26th','twenty-sixth','1971','old enough to fight','takoma park','2013','berkeley','oakland','austria','2007','school board'],
  html:`<table class="dtab"><tr><th>Year</th><th>What happened</th></tr>
   <tr><td><b>1971</b></td><td>The <b>26th Amendment</b> lowers the U.S. voting age from 21 to <b>18</b>. During the Vietnam War, supporters argued that if 18-year-olds were <b>“old enough to fight,”</b> they were <b>“old enough to vote.”</b></td></tr>
   <tr><td><b>2007</b></td><td><b>Austria</b> lowers its national voting age to <b>16</b>.</td></tr>
   <tr><td><b>2013</b></td><td><b>Takoma Park, Maryland</b>, becomes the first U.S. city to let 16-year-olds vote in local elections.</td></tr>
   <tr><td>Recent years</td><td>In California, voters in <b>Berkeley</b> and <b>Oakland</b> approve letting 16- and 17-year-olds vote for <b>school board</b>.</td></tr></table>
   <p style="margin-top:10px"><b>Supporters</b> say local decisions, like school budgets, parks, and curfews, affect teens directly. They also argue that people who vote in their first eligible election are more likely to keep voting, and 16-year-olds are usually still living at home and in school, which makes voting easier to start.</p>
   <p><b>Opponents</b> say most 16-year-olds are not legally adults, may not follow local issues closely, and could be influenced by parents or teachers. They argue 18 is a clear line that matches other adult rights and responsibilities.</p>`,
  cite:'Sources: U.S. Constitution, 26th Amendment (1971); City of Takoma Park, MD (2013); Berkeley and Oakland ballot measures on youth voting for school board; Austria electoral reform (2007). Arguments summarized for AVID discussion.'},
 'crispr-ethics':{type:'Article',title:'CRISPR: Cutting and Fixing DNA',keys:['crispr','cas9','casgevy','sickle cell','fda','december 2023','2023','$2 million','2 million','embryo','scissors'],
  html:`<p>Every cell in your body carries <b>DNA</b>, the instructions for building and running you. <b>CRISPR</b> is a gene-editing tool scientists adapted from bacteria. A guide molecule leads a protein called <b>Cas9</b> to an exact spot in the DNA, and Cas9 <b>“cuts”</b> the DNA there, like molecular <b>scissors</b>. The cell then repairs the cut, and scientists can use that repair to turn a gene off or change it.</p>
   <p>In <b>December 2023</b>, the U.S. <b>FDA</b> approved <b>Casgevy</b>, the first CRISPR-based therapy, to treat <b>sickle cell disease</b>. Sickle cell is an inherited disease in which red blood cells become stiff and curved, causing severe pain and organ damage. The treatment edits a patient’s own blood stem cells, which are then returned to the body.</p>
   <p>The treatment costs <b>more than $2 million</b> per patient, and it requires a long hospital stay. That raises questions about who can get it.</p>
   <p>There is a bigger ethical line, too. Editing a patient’s blood cells affects only that person. Editing an <b>embryo</b> would change genes that could be passed on to future generations. In 2018, a scientist in China announced he had edited embryos that became twin babies, and scientists around the world condemned it.</p>`,
  cite:'Sources: U.S. Food and Drug Administration approval of Casgevy (December 2023); general CRISPR-Cas9 science. Summary written for AVID discussion.'},
 'valley-water':{type:'Article + timeline',title:'The Valley’s Water Puzzle',keys:['subsidence','sinking','sink','groundwater','pump','sgma','2014','sustainable groundwater','tulare lake','2023','snowmelt'],
  html:`<p>The San Joaquin Valley is one of the most productive farming regions in the world, and much of its water comes from underground <b>aquifers</b>. When wells <b>pump</b> out <b>groundwater</b> faster than rain and rivers can refill it, layers of clay underground get squeezed, and the ground above can sink. This is called <b>land subsidence</b>. In parts of the Valley, subsidence has damaged canals, roads, and wells. When shallow wells run dry, some families in small rural towns have lost their drinking water.</p>
   <table class="dtab"><tr><th>Year</th><th>Event</th></tr>
   <tr><td>Late 1800s–1900s</td><td><b>Tulare Lake</b>, once a huge freshwater lake, is drained and its rivers are diverted for farming.</td></tr>
   <tr><td><b>2014</b></td><td>California passes the <b>Sustainable Groundwater Management Act (SGMA)</b>. Local agencies must make plans to bring groundwater pumping into balance over time.</td></tr>
   <tr><td><b>2023</b></td><td>After heavy storms and the melting of a huge snowpack, <b>Tulare Lake reappears</b>, flooding farmland and threatening nearby communities.</td></tr></table>
   <p style="margin-top:10px">The Valley faces a puzzle: <b>farms</b> provide jobs and food, <b>towns</b> need safe drinking water, and the <b>environment</b> (rivers, wetlands, and wildlife) needs water too. In dry years, there is not enough for everyone.</p>`,
  cite:'Sources: California Sustainable Groundwater Management Act (2014); U.S. Geological Survey and California Department of Water Resources information on San Joaquin Valley subsidence; news coverage of Tulare Lake’s return (2023). Summary written for AVID discussion.'},
 'money-class':{type:'Chart + worked example',title:'The Math Behind Money Class',keys:['ab 2927','2927','2030','one-semester','$1,629','1,629','1629','$2,653','2,653','$4,322','4,322','24%','26 months','$290','290','compound','interest'],
  html:`<p>In 2024, California signed <b>AB 2927</b>, which makes a <b>one-semester personal finance course</b> a graduation requirement, starting with students graduating in the <b>2030–31</b> school year. Here are two examples of the math these classes teach.</p>
   ${barChart('$1,000 saved once, earning 5% a year (compounded yearly)',[['Start',1000],['After 10 years',1629],['After 20 years',2653],['After 30 years',4322]],'$',4800,'#2b7de9')}
   <p style="margin-top:8px"><b>Compound interest working FOR you:</b> each year you earn 5% on your money <i>plus</i> on the interest you already earned. The formula is 1,000 × 1.05<sup>years</sup>. Your money more than quadruples in 30 years without adding another dollar.</p>
   <p><b>Compound interest working AGAINST you:</b> suppose you owe <b>$1,000</b> on a credit card with a <b>24%</b> yearly rate (2% per month) and pay <b>$50 a month</b>.</p>
   <table class="dtab"><tr><th>Credit card example</th><th>Result</th></tr>
   <tr><td>Time to pay it off</td><td>About <b>26 months</b></td></tr>
   <tr><td>Total paid</td><td>About <b>$1,290</b></td></tr>
   <tr><td>Interest paid</td><td>About <b>$290</b></td></tr></table>`,
  cite:'Sources: California Assembly Bill 2927 (2024). Calculations: savings = $1,000 × 1.05^n, rounded to the nearest dollar; credit card = $1,000 at 2% monthly interest with $50 monthly payments, rounded.'},
 'retakes':{type:'Two viewpoints',title:'Second Chances in the Gradebook',keys:['viewpoint a','viewpoint b','mastery','mistake','deadline','real world','procrastinat','workload','second chance'],
  html:`<p>Many schools are debating grading policies. Some teachers allow students to <b>retake tests</b> and turn in <b>late work</b>; others do not, or set limits. Read both viewpoints before you decide.</p>
   <table class="dtab"><tr><th>Viewpoint A: Allow retakes and late work</th><th>Viewpoint B: Keep firm deadlines</th></tr>
   <tr><td>A grade should show what you <b>learned</b>, not how fast you learned it. If a student studies their <b>mistakes</b> and then shows <b>mastery</b> on a retake, the higher score is more accurate. Students also have real lives: jobs, family responsibilities, illness, and sports. A second chance can keep a student from giving up after one bad day.</td>
   <td>In the <b>real world</b>, jobs, college applications, and bills have <b>deadlines</b>. If there is always a second chance, some students stop preparing the first time, which encourages <b>procrastination</b>. Retakes also add to teachers’ <b>workload</b>, since they must write and grade extra tests, which can mean less time for feedback and planning.</td></tr></table>
   <p style="margin-top:10px">Some schools try a middle path, such as allowing a retake only after the student completes test corrections or attends a tutorial, or giving partial credit for late work. In AVID, think about which policy best builds the habits you will need in college.</p>`,
  cite:'Arguments summarized for AVID discussion from common positions in the debate over standards-based grading and late-work policies.'},
 'heat-sports':{type:'Article + table',title:'Playing It Safe in the Heat',keys:['heat exhaustion','heat stroke','hydrat','heat index','wbgt','wet-bulb','wet bulb','humidity','cif','interscholastic','sweat','acclimat'],
  html:`<p>Your body cools itself mainly by <b>sweating</b>: as sweat evaporates, it carries heat away. When it is very hot and humid, sweat evaporates slowly, and an athlete working hard can heat up faster than the body can cool down. That leads to <b>heat illness</b>.</p>
   <table class="dtab"><tr><th>Condition</th><th>Warning signs</th></tr>
   <tr><td><b>Heat exhaustion</b></td><td>Heavy sweating, dizziness, headache, nausea, weakness, cramps</td></tr>
   <tr><td><b>Heat stroke</b> (a medical emergency)</td><td>Very high body temperature, confusion, fainting; needs rapid cooling and 911</td></tr></table>
   <p style="margin-top:10px"><b>Hydration</b> matters: athletes should drink water before, during, and after practice, not just when they feel thirsty. Bodies also need time to <b>acclimatize</b>, or adjust, to heat over several days.</p>
   <p>Air temperature alone does not show the full danger. The <b>heat index</b> combines temperature and <b>humidity</b> to show how hot it feels. The <b>Wet-Bulb Globe Temperature (WBGT)</b> goes further: it also accounts for sun and wind, so many athletic programs use it to decide when to add water breaks, remove equipment, move practice to a cooler time, or cancel.</p>
   <p>The <b>California Interscholastic Federation (CIF)</b> has heat-illness guidelines for school sports, and California has adopted heat-safety rules for student athletes.</p>`,
  cite:'Sources: general heat illness and hydration guidance from public health agencies; California Interscholastic Federation (CIF) heat-illness guidelines. Summary written for AVID discussion.'},
 'history-lens':{type:'Two perspectives',title:'The Gold Rush: Two Stories',keys:['perspective a','perspective b','polk','1848','extraordinary character','native','californio','chinese','foreign miners','gold rush','left out'],
  html:`<p>In January <b>1848</b>, gold was discovered at Sutter’s Mill in California. Within a few years, hundreds of thousands of people rushed in. Two perspectives on the same event tell very different stories.</p>
   <table class="dtab"><tr><th>Perspective A: The President’s report (primary source)</th><th>Perspective B: Historian summary</th></tr>
   <tr><td>In December 1848, President <b>James K. Polk</b> told Congress: <i>“The accounts of the abundance of gold in that territory are of such an extraordinary character as would scarcely command belief were they not corroborated by the authentic reports of officers in the public service.”</i><br><br>Newspapers spread the news, and “Forty-Niners” arrived from across the U.S. and the world hoping to get rich. California became a state in 1850.</td>
   <td><i>(Written for this lesson, based on what historians widely agree on.)</i> For <b>Native Californians</b>, the Gold Rush was a disaster. Miners took over their lands, food sources, and rivers, and many Native people were killed by violence, disease, and starvation. <b>Californios</b>, Mexican Californians who had lived there for generations, often lost their land. <b>Chinese</b> and Latin American miners faced discrimination, including California’s <b>Foreign Miners’ Tax</b> of 1850.</td></tr></table>
   <p style="margin-top:10px">Perspective A comes from a powerful leader writing at the time. Perspective B pulls together the experiences of people whose voices were often <b>left out</b> of official reports.</p>`,
  cite:'Sources: President James K. Polk, Annual Message to Congress (December 5, 1848), public domain; historian summary written for AVID discussion based on standard California history references.'}
};

const dWords=s=>(String(s||'').trim().match(/\S+/g)||[]).length;
const usesSource=(text,keys)=>keys&&keys.length?(keys.some(k=>String(text).toLowerCase().includes(String(k).toLowerCase()))||/["“][^"”]{8,}["”]/.test(text)):/because|for example|for instance|according to|evidence|["“]|\d/i.test(text);
function mainPostPoints(text,min,keys){const w=dWords(text);let p=w>=min?4:w>=min/2?2:w>0?1:0;if(usesSource(text,keys))p+=1;if(/\?/.test(text))p+=1;return Math.min(6,p)}
const replyPoints=text=>{const w=dWords(text);return w>=30?2:w>=15?1:0};

/* ---------- ✍️ Annotate the discussion source (free practice, nothing is right or wrong) ---------- */
function annotateSource(box,key){
  const body=box.querySelector('.dsrc-body'); if(!body) return {count:()=>0};
  let st={m:{},n:{}}; try{st=JSON.parse(localStorage.getItem(key)||'null')||st}catch(e){}
  const save=()=>{try{localStorage.setItem(key,JSON.stringify(st))}catch(e){}; paintCount()};
  /* wrap every word (not inside charts) in a clickable span */
  let i=0; const walker=document.createTreeWalker(body,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('svg')||!n.textContent.trim()?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(t=>{const frag=document.createDocumentFragment();t.textContent.split(/(\s+)/).forEach(w=>{if(!w)return;if(/^\s+$/.test(w)){frag.appendChild(document.createTextNode(w));return}
    const sp=document.createElement('span');sp.className='aw';sp.dataset.i=i++;sp.textContent=w;frag.appendChild(sp)});t.replaceWith(frag)});
  const bar=document.createElement('div'); bar.className='annbar';
  bar.innerHTML=`<span class="annlbl">✍️ Annotate:</span>${[['h','🟨 Highlight'],['u','⎁ Underline'],['c','⭕ Circle'],['n','💬 Note'],['e','🧽 Erase']].map(([k,l],j)=>`<button class="anntool ${j===0?'on':''}" data-t="${k}">${l}</button>`).join('')}<button class="anntool" data-clear>↺ Clear all</button><span class="anncount"></span>`;
  body.before(bar);
  const tip=document.createElement('p'); tip.className='anntip'; tip.innerHTML='Practice your reading skills: <b>highlight</b> evidence, <b>underline</b> the main idea, <b>circle</b> key words, and add <b>notes</b> with your questions or reactions. Click a word or drag across several.'; bar.after(tip);
  let tool='h', drag=false;
  const W=idx=>body.querySelector(`.aw[data-i="${idx}"]`);
  function paint(){body.querySelectorAll('.aw').forEach(w=>{const m=st.m[w.dataset.i]||{};w.classList.toggle('ah',!!m.h);w.classList.toggle('au',!!m.u);w.classList.toggle('ac',!!m.c)});
    body.querySelectorAll('.annnote').forEach(n=>n.remove());
    Object.entries(st.n).forEach(([idx,txt])=>addNote(idx,txt,false));paintCount()}
  function paintCount(){const c=Object.values(st.m).reduce((a,m)=>a+(m.h?1:0)+(m.u?1:0)+(m.c?1:0),0)+Object.values(st.n).filter(t=>t&&t.trim()).length;
    bar.querySelector('.anncount').textContent=c?`${c} annotation${c===1?'':'s'}`:'';box.dataset.ann=c}
  function addNote(idx,txt,focus){const w=W(idx);if(!w)return;let n=w.nextElementSibling&&w.nextElementSibling.classList.contains('annnote')?w.nextElementSibling:null;
    if(!n){n=document.createElement('span');n.className='annnote';n.innerHTML='💬<input placeholder="Your note…"><button title="Delete note">✕</button>';w.after(n);
      n.querySelector('input').oninput=e=>{st.n[idx]=e.target.value;save()};n.querySelector('button').onclick=()=>{delete st.n[idx];n.remove();save()}}
    n.querySelector('input').value=txt||'';if(focus)n.querySelector('input').focus()}
  function apply(w){const idx=w.dataset.i;
    if(tool==='n'){if(st.n[idx]===undefined)st.n[idx]='';addNote(idx,st.n[idx],true);save();return}
    if(tool==='e'){delete st.m[idx];delete st.n[idx];paint();save();return}
    const m=st.m[idx]=st.m[idx]||{}; m[tool]=drag==='on'?true:drag==='off'?false:!m[tool]; if(!m.h&&!m.u&&!m.c)delete st.m[idx];
    w.classList.toggle('a'+tool,!!(st.m[idx]&&st.m[idx][tool]));save()}
  bar.addEventListener('click',e=>{const b=e.target.closest('.anntool');if(!b)return;
    if(b.hasAttribute('data-clear')){if(confirm('Clear all your annotations on this reading?')){st={m:{},n:{}};paint();save()}return}
    tool=b.dataset.t;bar.querySelectorAll('.anntool[data-t]').forEach(x=>x.classList.toggle('on',x===b))});
  body.addEventListener('pointerdown',e=>{const w=e.target.closest('.aw');if(!w||e.target.closest('.annnote'))return;e.preventDefault();
    if(['h','u','c'].includes(tool)){const on=!((st.m[w.dataset.i]||{})[tool]);drag=on?'on':'off';apply(w)}else{drag=false;apply(w)}});
  body.addEventListener('pointerover',e=>{if(!drag||tool==='c')return;const w=e.target.closest('.aw');if(w)apply(w)});
  document.addEventListener('pointerup',()=>{drag=false});
  paint();
  return {count:()=>+box.dataset.ann||0};
}

function board(el,d,st,ann){
  let posts=[],view='class',openReply=null,busy=false,loadErr='';
  const SRC=DSRC[d.id], KEYS=SRC?SRC.keys:null; let readOK=!SRC; try{readOK=readOK||localStorage.getItem('read-'+d.id+'-'+st.id)==='1'}catch(e){}
  const draft={main:'',reply:{}};
  async function load(){try{const r=await hubList(d.id,st.id);if(!r.ok)throw new Error(r.error||'Could not load posts');posts=r.posts;loadErr=''}catch(e){loadErr='Could not load posts. Check your internet connection and try Refresh.'}draw()}
  const mineMain=()=>posts.find(p=>p.mine&&p.type==='Main post');
  const myScore=()=>{const m=mineMain();const rs=posts.filter(p=>p.mine&&p.type==='Reply').map(p=>replyPoints(p.text)).sort((a,b)=>b-a);const mp=m?mainPostPoints(m.text,d.minWords,KEYS):0,rp=(rs[0]||0)+(rs[1]||0);return {mp,rp,n:rs.length,total:mp+rp}};
  const inView=p=>view==='all'||(p.teacher===st.teacher&&String(p.period)===String(st.period));
  function postHTML(p,isReply){
    const kids=posts.filter(c=>c.parent===p.id).sort((a,b)=>new Date(a.time)-new Date(b.time));
    return `<article class="dpost ${isReply?'reply':''} ${p.mine?'mine':''}"><div class="dav">${initials(p.name)}</div><div class="dbody2">
     <div class="dmeta"><b>${esc(p.name)}</b>${p.mine?'<span class="you">You</span>':''}${p.sample?'<span class="you">Sample</span>':''}<span>${esc(p.teacher)} · P${esc(p.period)}</span><span>${ago(p.time)}</span></div>
     <div class="dtext">${esc(p.text).replace(/\n/g,'<br>')}</div>
     ${!isReply&&!p.mine&&mineMain()?`<button class="dreply-btn" data-reply="${p.id}">↩ Reply</button>`:''}
     ${openReply===p.id?`<div class="dcompose small"><div class="dframes">${d.frames.map(f=>`<button class="dframe" data-frame="${esc(f)}">${esc(f)}</button>`).join('')}</div>
       <textarea id="rtext" rows="4" placeholder="Reply to ${esc(p.name)}: build on, question, or respectfully challenge their idea…">${esc(draft.reply[p.id]||'')}</textarea>
       <div class="dbar"><span id="rwc">${dWords(draft.reply[p.id]||'')} / 30 words</span><button class="dbtn" id="rsend" data-parent="${p.id}">Post reply</button></div></div>`:''}
     ${kids.length?`<div class="dkids">${kids.map(k=>postHTML(k,true)).join('')}</div>`:''}</div></article>`;
  }
  function draw(){
    const m=mineMain(), sc=myScore();
    const mains=posts.filter(p=>p.type==='Main post').sort((a,b)=>new Date(b.time)-new Date(a.time));
    const cls=mains.filter(p=>p.teacher===st.teacher&&String(p.period)===String(st.period)).length;
    const shown=mains.filter(inView);
    el.innerHTML=`${targetStrip({eq:d.eq,lt:d.lt},st)}
     ${loadErr?`<div class="demo-note">⚠️ ${loadErr}</div>`:''}
     ${m?`<div class="dscore"><div><b>Your score so far: ${sc.total} / 10</b><br><small>Main post ${sc.mp}/6 · Replies ${sc.rp}/4 (${sc.n} posted${sc.n<2?`, ${2-sc.n} more to go`:' ✓'})</small></div><button class="dbtn ghost" id="drefresh">↻ Refresh</button></div>`:
     !readOK?`<div class="dcompose readgate"><h3>📖 Step 1: Read the source above</h3><p>Read the source carefully and <b>annotate it</b>: highlight evidence, underline the main idea, circle key words, and add a note. Look for a detail, number, or quote you can use in your post.</p><button class="dbtn" id="didread">✅ I read the source. Let me post.</button></div>`:
     `<div class="dcompose"><h3>✍️ Your main post</h3><p class="hint" style="margin:0 0 8px;color:var(--muted);font-weight:700">Make a claim, support it with evidence from the source, and end with a question for your classmates.</p><div class="dframes">${d.frames.map(f=>`<button class="dframe" data-frame="${esc(f)}">${esc(f)}</button>`).join('')}</div>
      <textarea id="mtext" rows="8" placeholder="Share your thinking. Use evidence and end with a question for your classmates.">${esc(draft.main)}</textarea>
      <ul class="dchecks" id="mchk"></ul>
      <div class="dbar"><span id="mwc"></span><button class="dbtn" id="msend">Post to the discussion</button></div><p class="dmsg" id="mmsg"></p></div>`}
     <div class="dthread-head"><h2>Class discussion</h2><div class="dview"><button class="fchip ${view==='class'?'on':''}" data-view="class">My class (${cls})</button><button class="fchip ${view==='all'?'on':''}" data-view="all">All classes (${mains.length})</button></div></div>
     ${m?(shown.length?shown.map(p=>postHTML(p,false)).join(''):`<p class="empty">No posts from your class yet. Try “All classes”.</p>`)
       :`<div class="locked">🔒 <b>${mains.length} ${mains.length===1?'classmate has':'classmates have'} posted.</b> Share your own thinking first to unlock their posts, just like a college discussion board.</div>`}
     <p class="dmsg" id="rmsg"></p>`;
    wire();
  }
  function checks(){const t=draft.main,w=dWords(t);const c=[[w>=d.minWords,`${w} / ${d.minWords} words`],[usesSource(t,KEYS),KEYS?'Uses evidence from the source (a detail, number, or quote)':'Uses evidence (because, for example, a quote, or a fact)'],[/\?/.test(t),'Asks your classmates a question']];
    const ul=el.querySelector('#mchk');if(ul)ul.innerHTML=c.map(([ok,l])=>`<li class="${ok?'ok':''}">${l}</li>`).join('');
    const wc=el.querySelector('#mwc');if(wc)wc.textContent=`Points if you post now: ${mainPostPoints(t,d.minWords,KEYS)} / 6`;
    const b=el.querySelector('#msend');if(b)b.disabled=w<20||busy;}
  function wire(){
    el.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;draw()});
    const dr=el.querySelector('#didread'); if(dr) dr.onclick=()=>{readOK=true;try{localStorage.setItem('read-'+d.id+'-'+st.id,'1')}catch(e){};draw();const t=el.querySelector('#mtext');if(t)t.focus()};
    const mt=el.querySelector('#mtext'); if(mt){mt.oninput=()=>{draft.main=mt.value;checks()};checks()}
    el.querySelectorAll('.dframe').forEach(b=>b.onclick=()=>{const ta=el.querySelector(openReply?'#rtext':'#mtext')||el.querySelector('#mtext');if(!ta)return;ta.value=(ta.value?ta.value.trim()+' ':'')+b.dataset.frame+' ';ta.focus();ta.dispatchEvent(new Event('input'))});
    const ms=el.querySelector('#msend'); if(ms) ms.onclick=async()=>{busy=true;checks();el.querySelector('#mmsg').textContent='Posting…';
      try{const r=await hubSend({action:'post',student:st,prompt:d.id,promptTitle:d.title,minWords:d.minWords,sourceKeys:KEYS||[],annotations:ann?ann.count():0,text:draft.main});if(!r.ok)throw new Error(r.error);draft.main='';await load();}
      catch(e){busy=false;checks();el.querySelector('#mmsg').textContent='⚠️ '+(e.message||'Could not post. Try again.')}busy=false};
    el.querySelectorAll('[data-reply]').forEach(b=>b.onclick=()=>{openReply=openReply===b.dataset.reply?null:b.dataset.reply;draw();const t=el.querySelector('#rtext');if(t)t.focus()});
    const rt=el.querySelector('#rtext'); if(rt) rt.oninput=()=>{draft.reply[openReply]=rt.value;el.querySelector('#rwc').textContent=`${dWords(rt.value)} / 30 words`};
    const rs=el.querySelector('#rsend'); if(rs) rs.onclick=async()=>{const txt=draft.reply[openReply]||'';if(dWords(txt)<5){el.querySelector('#rwc').textContent='Write a little more first.';return}
      rs.disabled=true;rs.textContent='Posting…';
      try{const r=await hubSend({action:'post',student:st,prompt:d.id,promptTitle:d.title,minWords:d.minWords,parent:openReply,text:txt});if(!r.ok)throw new Error(r.error);delete draft.reply[openReply];openReply=null;await load();}
      catch(e){rs.disabled=false;rs.textContent='Post reply';el.querySelector('#rmsg').textContent='⚠️ '+(e.message||'Could not post. Try again.')}};
    const rf=el.querySelector('#drefresh'); if(rf) rf.onclick=load;
  }
  clearInterval(boardTimer); boardTimer=setInterval(()=>{if(!openReply&&!busy&&document.activeElement?.id!=='mtext'&&mineMain())load()},45000);
  el.innerHTML='<p class="empty">Loading the discussion…</p>'; load();
}

     ${sorted.map(r=>`<tr><td>${esc(r.n)}</td><td>${r.amt?'$'+(+r.amt).toLocaleString():''}</td><td>${esc(r.due||'')}</td><td>${esc(r.req||'')}</td><td><select data-s="${r.i}">${['Researching','Working on it','Submitted','Won','Not selected'].map(x=>`<option ${x===r.status?'selected':''}>${x}</option>`).join('')}</select></td><td><button class="x" data-del="${r.i}">✕</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">No scholarships yet. Add your first one above!</td></tr>'}</table>
     ${total?`<p class="agsum okc">🎉 Scholarships won: $${total.toLocaleString()}</p>`:''}
     <h3>🔍 Where to look</h3><ul class="aid"><li>Your school’s counseling or college & career center (local scholarships often have fewer applicants!)</li><li>Cash for College scholarship finder (CSAC)</li><li>BigFuture scholarship search (College Board)</li><li>Local businesses, churches, clubs, and service organizations in Tulare County</li><li>Each college’s financial aid office</li></ul>
     <p class="muted"><small>⚠️ Never pay to apply for a scholarship. Real scholarships are free to apply for.</small></p></div>`;
    el.querySelector('#s-add').onclick=()=>{const n=el.querySelector('#s-n').value.trim();if(!n)return;rows.push({n,amt:el.querySelector('#s-a').value,due:el.querySelector('#s-d').value,req:el.querySelector('#s-r').value,status:'Researching'});save();draw()};
    el.querySelectorAll('[data-s]').forEach(s=>s.onchange=()=>{rows[s.dataset.s].status=s.value;save();draw()});
    el.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{rows.splice(+b.dataset.del,1);save();draw()});
  };
  draw();
}

      catch(e){m.textContent='⚠️ '+(e.message||'Could not send. Try again.')}};
  };

}

function printURL(u){let m;if((m=u.match(/document\/d\/([\w-]+)/)))return `https://docs.google.com/document/d/${m[1]}/export?format=pdf`;if((m=u.match(/presentation\/d\/([\w-]+)/)))return `https://docs.google.com/presentation/d/${m[1]}/export/pdf`;if((m=u.match(/spreadsheets\/d\/([\w-]+)/)))return `https://docs.google.com/spreadsheets/d/${m[1]}/export?format=pdf`;return u}
const kindOf=it=>it.k==='lesson'&&CH[it.id]?'graded':it.k;
function itemHTML(it,from){
  const kind=kindOf(it);
  const ch=it.k==='lesson'&&CH[it.id], meta=it.meta||(ch?`${ch.hands?'Hands-on · ':''}${ch.subj||''}`:'');
  const go=it.go?it.go:it.k==='link'?'Visit site ↗':it.k==='note'?'':it.k==='nav'?'Go there →':it.k==='page'?`${meta?meta+' · ':''}Start lesson →`:(meta?`${meta} · Open →`:'Open →');
  const inner=`<span class="top"><span class="ico">${kindIcon[it.k]}</span><span class="kpill k-${kind}">${it.label||KIND[kind]}</span></span><span class="t">${it.title}</span><span class="d">${it.desc}</span>${it.k==='print'?`<span class="pmeta">${it.aud?`<span class="aud a-${it.aud}">${AUD[it.aud]}</span>`:''}${it.isNew?'<span class="aud a-new">New</span>':''}</span>`:''}${from?`<span class="from">${from}</span>`:''}${it.k==='print'?`<span class="go pbtns"><a href="${it.url}" target="_blank" rel="noopener">Open ↗</a><a class="pr" href="${printURL(it.url)}" target="_blank" rel="noopener" title="Download a PDF to print">🖨️ Print</a></span>`:go?`<span class="go">${go}</span>`:''}`;
  const cls=`rcard${it.add?' add':''}${it.feature?' feature':''}`;
  if(it.k==='print') return `<div class="${cls} printable" data-kind="${kind}" data-aud="${it.aud||'both'}">${inner}</div>`;
  if(it.k==='page') return `<a class="${cls}" data-kind="${kind}" data-subj="${it.subj||''}" href="${it.url}">${inner}</a>`;
  if(it.k==='link') return `<a class="${cls}" data-kind="${kind}" href="${it.url}" target="_blank" rel="noopener">${inner}</a>`;
  if(it.k==='nav') return `<a class="${cls}" data-kind="${kind}" href="${it.url}">${inner}</a>`;
  if(it.k==='note') return `<div class="${cls}" data-kind="${kind}">${inner}</div>`;
  return `<button class="${cls}" data-kind="${kind}" data-subj="${ch?ch.subj||'':''}" data-k="${it.k}" data-id="${it.id}">${inner}</button>`;
}

    return;
  }
  app.innerHTML=`<div class="wrap"><div class="hero">${CONFETTI}${IS_TEACHER?'<h1>Welcome, <span>teachers!</span></h1><p>Pick a space to find handouts, tools, and lessons for your classroom. You are in the 🍎 teacher view.</p>':'<h1>Welcome, <span>AVID students!</span></h1><p>Pick a space to practice WICOR, find lessons, and plan for college and career.</p>'}</div>
  <div class="tiles">${SECTIONS.map(s=>`<a class="tile" href="#${s.id}" style="--c:${s.color}"><span class="stk">${ART[s.id]}</span><h2>${s.name}</h2></a>`).join('')}</div></div>`;
}
let spy=null;
function section(s){
  if(s.id==='wicor'){wicorHome(s);return}
  spaceHome(s);return;
  crumb.innerHTML=`<span>›</span><b>${s.name}</b>`;
  const all=s.topics.flatMap(t=>t.items);
  const kinds=['print','page','handout','lesson','graded','link'].filter(k=>all.some(it=>kindOf(it)===k));
  const hasAud=all.some(it=>it.k==='print');
  const subjs=['Math','Science','English','History','AVID skills'].filter(x=>all.some(it=>it.k==='lesson'&&CH[it.id]&&CH[it.id].subj===x));
  const plural={handout:'Handouts',lesson:'Interactive',graded:'Graded',link:'Websites',print:'Printables',page:'WICOR Lessons'};
  app.innerHTML=`<div class="wrap" style="--c:${s.color}">
   <nav class="switch" aria-label="Spaces"><a class="back" href="#home">← All spaces</a>${SECTIONS.map(x=>`<a class="swchip ${x===s?'on':''}" style="--c:${x.color}" href="#${x.id}">${x.name}</a>`).join('')}</nav>
   <div class="banner"><h1>${s.name}</h1><p>${s.blurb}</p><div class="stats"><span>${s.topics.length} topics</span><span>${all.filter(i=>i.k!=='note').length} resources</span></div><span class="art">${ART[s.id]}</span></div>
   <div class="layout"><nav class="rail" aria-label="Topics"><div class="lbl">Topics</div>${s.topics.map((t,i)=>`<a href="#${s.id}" data-jump="t${i}">${t.name}<small>${t.items.length}</small></a>`).join('')}</nav>
   <div>${subjs.length>1?`<div class="filters" role="group" aria-label="Filter by subject"><span class="flbl">Subject</span><button class="fchip sj on" data-sj="all">All</button>${subjs.map(x=>`<button class="fchip sj" data-sj="${x}">${x}</button>`).join('')}</div>`:''}${hasAud?`<div class="filters" role="group" aria-label="Filter by audience"><span class="flbl">For</span><button class="fchip au on" data-au="all">Everyone</button><button class="fchip au" data-au="student">🎒 Students</button><button class="fchip au" data-au="teacher">👩‍🏫 Teachers</button></div>`:''}${kinds.length>1?`<div class="filters" role="group" aria-label="Filter by type"><button class="fchip on" data-f="all">All</button>${kinds.map(k=>`<button class="fchip" data-f="${k}">${plural[k]}</button>`).join('')}</div>`:''}
   ${s.topics.map((t,i)=>`<section class="topic" id="t${i}"><header><span class="dot"></span><h2>${t.name}</h2><small>${t.items.length} ${t.items.length===1?'item':'items'}</small></header>${t.sub?`<p class="sub">${t.sub}</p>`:''}<div class="cards">${t.items.map(it=>itemHTML(it)).join('')}</div></section>`).join('')}</div></div></div>`;
  const links=[...app.querySelectorAll('[data-jump]')];
  links.forEach(a=>a.onclick=e=>{e.preventDefault();document.getElementById(a.dataset.jump).scrollIntoView({behavior:'smooth'})});
  let fk='all',fs='all',fa='all';
  const applyF=()=>{app.querySelectorAll('.topic').forEach(sec=>{let n=0;sec.querySelectorAll('.rcard').forEach(c=>{const show=(fk==='all'||c.dataset.kind===fk)&&(fs==='all'||c.dataset.subj===fs)&&(fa==='all'||!c.dataset.aud||c.dataset.aud===fa||c.dataset.aud==='both');c.hidden=!show;if(show)n++});sec.hidden=n===0;const l=links.find(a=>a.dataset.jump===sec.id);if(l)l.hidden=n===0})};
  app.querySelectorAll('.fchip:not(.sj):not(.au)').forEach(b=>b.onclick=()=>{app.querySelectorAll('.fchip:not(.sj):not(.au)').forEach(x=>x.classList.toggle('on',x===b));fk=b.dataset.f;applyF()});
  app.querySelectorAll('.fchip.au').forEach(b=>b.onclick=()=>{app.querySelectorAll('.fchip.au').forEach(x=>x.classList.toggle('on',x===b));fa=b.dataset.au;applyF()});
  app.querySelectorAll('.fchip.sj').forEach(b=>b.onclick=()=>{app.querySelectorAll('.fchip.sj').forEach(x=>x.classList.toggle('on',x===b));fs=b.dataset.sj;applyF()});
  if(spy)spy.disconnect();
  if('IntersectionObserver' in window){
    spy=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)links.forEach(a=>a.classList.toggle('on',a.dataset.jump===e.target.id))})},{rootMargin:'-90px 0px -60% 0px'});
    app.querySelectorAll('.topic').forEach(t=>spy.observe(t));
  }
  if(links[0])links[0].classList.add('on');
}
let cleanup=null;
function openItem(k,id,color){
  const isL=k==='lesson', d=isL?L[id]:H[id]; if(!d)return;
  if(cleanup){cleanup();cleanup=null}
  modal.style.setProperty('--c',color);
  modal.innerHTML=`<div class="dialog ${isL?'wide':''}" role="dialog" aria-modal="true" aria-label="${d.title}"><div class="dhead"><h3>${d.title}</h3>${isL?'<button id="fs">Present</button>':''}<button id="cl">Close</button></div><div class="dbody">${isL?'<div id="lz"></div>':`<div class="note">Starter template — project it, or use it as a model for your own copy. Printable PDF versions are coming soon.</div><div class="paper">${d.html}</div>`}</div></div>`;
  modal.hidden=false; modal.classList.remove('full'); document.body.style.overflow='hidden';
  if(isL){const lz=modal.querySelector('#lz');
    if(NO_SIGNIN.has(id)) cleanup=d.run(lz)||null;
    else studentGate(lz,d.title,ACT_INFO[id],st=>{lz.innerHTML=targetStrip(ACT_INFO[id],st)+'<div id="lz2"></div>';cleanup=d.run(lz.querySelector('#lz2'))||null;});}
  modal.querySelector('#cl').onclick=closeModal;
  const fs=modal.querySelector('#fs'); if(fs) fs.onclick=()=>{const on=modal.classList.toggle('full');fs.textContent=on?'Exit present':'Present';try{on?document.documentElement.requestFullscreen?.()?.catch(()=>{}):document.fullscreenElement&&document.exitFullscreen()}catch(e){}};
  modal.querySelector('#cl').focus();
}
function closeModal(){if(cleanup){cleanup();cleanup=null}modal.hidden=true;modal.innerHTML='';document.body.style.overflow='';try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}}
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden)closeModal()});
app.addEventListener('click',e=>{const b=e.target.closest('button.rcard');if(!b)return;const c=getComputedStyle(b).getPropertyValue('--c');openItem(b.dataset.k,b.dataset.id,c)});
function route(){closeModal();clearInterval(boardTimer);const id=location.hash.slice(1);const [main,sub,third]=id.split('/');const s=SECTIONS.find(x=>x.id===main);qInput.value='';
  if(s&&s.id==='wicor'&&sub)wicorSub(s,sub);
  else if(s&&s.id==='avid'&&sub==='discuss')third?discussPage(s,third):discussHome(s);
  else if(s&&sub!==undefined&&sub!==''&&!isNaN(+sub))spaceFolder(s,+sub);
  else s?section(s):home();window.scrollTo(0,0)}
qInput.addEventListener('input',()=>{if(qInput.value.trim()){home(qInput.value.trim())}else route()});
window.addEventListener('hashchange',route);route();
</script>
</body>
