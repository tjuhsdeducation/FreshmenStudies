<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fast Fashion | WICOR English 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="wicor-lesson.css">
</head>
<body>
<script>
/* =====================================================================
   ✏️ LESSON CONTENT: Claims, Counterclaims & Rebuttals (English 2)
   In the article:  [C] = claim   [E] = evidence   [R] = reasoning
                    {{word}} = a key term students should circle
   ===================================================================== */
const FRAMES = [ "I agree with ___ because…", "I respectfully disagree because…", "Can you clarify what you mean by…?",
                 "I'd like to build on that idea…", "What evidence do you have that…?", "I used to think ___, but now I think…" ];
const LESSON = {
  id: "eng2-fast-fashion",
  subject: "English 2",
  short: "English 2: Counterclaims",
  color: "#0e9f6e",
  emoji: "👕",
  eq: "How do strong arguments address the other side?",
  targets: {"R": "I can identify the claim, evidence, reasoning, counterclaim, and rebuttal in an argumentative essay.", "W": "I can write a CER paragraph that includes a counterclaim and a rebuttal.", "I": "I can use a cost-per-wear model to test the author's rebuttal.", "C": "I can support my position with evidence and respond respectfully to a peer.", "O": "I can map the claim, counterclaim, rebuttal, and evidence in an argument."},
  title: "The Real Price of a $5 T-Shirt",
  intro: "Is cheap clothing really cheap? Analyze an argument about fast fashion, write a CER that answers the other side, run a cost-per-wear lab, debate, and build an argument map. Five stations, about 5–10 minutes each.",
  order: ["R", "W", "I", "C", "O"],
  stations: {

    R: {
      title: "Read & Annotate", time: "8–10 min",
      goal: "Read the argument and mark it up: underline the <b>claim</b>, highlight <b>evidence</b> and <b>reasoning</b>, circle <b>key terms</b>, and write at least one <b>margin note</b>. In a note, label the <b>counterclaim</b> and the <b>rebuttal</b> in the last paragraph.",
      minKeys: 4,
      gist: "In one sentence, what does the author want you to believe, and what opposing view does the author answer?",
      article: {
        title: "The Real Price of a $5 T-Shirt",
        byline: "English 2 · AVID WICOR reading · Argumentative essay",
        paragraphs: [
          [ "A trendy shirt for five dollars sounds like a great deal.",
            "Brands that sell cheap, quickly changing styles are known as {{fast fashion}}, and they have changed the way many people shop.",
            "[C] Fast fashion costs far more than its price tag, because its hidden costs are paid by the environment and by the workers who make the clothes." ],
          [ "Fast-fashion companies release new styles constantly, encouraging shoppers to buy more and wear each item fewer times.",
            "Many of these clothes are made from {{synthetic}} fabrics like polyester, which is made from oil.",
            "Because the clothes are so cheap, they can start to feel {{disposable}}." ],
          [ "[E] According to the U.S. Environmental Protection Agency, Americans threw away about 17 million tons of textiles in 2018, and most of it ended up in {{landfills}}.",
            "[E] The United Nations Environment Programme estimates that the fashion industry produces between 2 and 8 percent of the world's {{greenhouse gas emissions}}.",
            "[E] In 2013, the Rana Plaza factory building in Bangladesh collapsed, killing more than 1,100 garment workers who made clothing for global brands." ],
          [ "[R] When a shirt is cheap enough to throw away, its true costs do not disappear; they simply move to landfills, the atmosphere, and factory floors.",
            "[R] Shoppers who look only at the price tag are not seeing the whole bill." ],
          [ "Some people argue that fast fashion makes stylish clothing affordable for families on tight budgets.",
            "That is a fair point, but buying fewer, better-made items, shopping secondhand, and repairing clothes can save money over time while reducing waste.",
            "The cheapest shirt is not always the one with the lowest price; it is the one you wear again and again." ]
        ]
      }
    },

    W: {
      title: "Write a CER Paragraph", time: "8–10 min",
      goal: "Write a <b>Claim–Evidence–Reasoning</b> paragraph that also answers a <b>counterclaim</b>. Each box lights up when that part is strong.",
      prompt: "Is fast fashion worth the cost? Write a CER. In your reasoning, answer the counterclaim that fast fashion is the only affordable option.",
      parts: [
        { key: "claim", label: "Claim", sub: "Your position", starter: "Fast fashion is / is not worth the cost because…",
          hint: "One sentence that takes a clear, arguable position.", checkLabel: "Claim takes a position (8+ words)",
          check: v => words(v) >= 8 && /fashion|cloth|shirt/i.test(v) },
        { key: "evidence", label: "Evidence", sub: "Proof from the text", rows: 3, starter: "According to the article, …",
          hint: "Quote or paraphrase a <b>specific</b> fact and name its source (EPA, UN, Rana Plaza…).",
          checkLabel: "Evidence cites a specific source or statistic",
          check: v => words(v) >= 12 && /article|text|author|according|["“]/i.test(v) && /17 million|epa|environmental protection|landfill|2 and 8|percent|emission|rana plaza|1,?100|bangladesh|united nations/i.test(v) },
        { key: "reasoning", label: "Reasoning + Rebuttal", sub: "Why, and answer the other side", rows: 4, starter: "This shows that… Some people argue…, but…",
          hint: "Explain WHY your evidence matters, then name the counterclaim and <b>rebut</b> it (use <b>but</b> or <b>however</b>).",
          checkLabel: "Reasoning explains WHY and rebuts a counterclaim",
          check: v => words(v) >= 20 && /because|this shows|this means|therefore|which means/i.test(v) && /\bbut\b|however|although|while|even though/i.test(v) }
      ],
      minTerms: 3, minWords: 55,
      terms: [ ["fast fashion", /fast fashion/i], ["landfill", /landfill/i], ["emissions", /emission/i], ["disposable", /disposable/i],
               ["counterclaim", /counterclaim|some (people )?argue|others argue/i], ["rebuttal", /rebut|however/i], ["environment", /environment/i] ]
    },

    I: {
      title: "Predict, Test & Graph", time: "10 min",
      goal: "Investigate the rebuttal like a researcher: <b>predict</b>, run the <b>cost-per-wear lab</b>, graph both shirts, and ask a <b>Level 3 question</b>.",
      predict: {
        q: "Predict: As you wear a shirt more and more times, what happens to its COST PER WEAR?",
        placeholder: "If a shirt is worn more times, then its cost per wear will … because …",
        options: [
          { v: "curve", label: "Drops fast, then levels off", d: "M14 8 C 30 50, 60 56, 106 58" },
          { v: "linear", label: "Drops steadily", d: "M14 8 L106 56" },
          { v: "up", label: "Goes up", d: "M14 56 L106 8" },
          { v: "flat", label: "Stays the same", d: "M14 30 L106 30" } ]
      },
      lab: {
        title: "Test it: Cost-Per-Wear Lab",
        intro: "In this <b>model</b>, an $8 fast-fashion shirt wears out after about 10 wears and must be replaced, while a $32 well-made shirt lasts 60 wears. (These are practice numbers, not data about real brands.) Record the cost per wear for <b>at least 5 different numbers of wears for BOTH shirts</b>. Where do the lines meet?",
        controls: [
          { type: "seg", id: "shirt", label: "👕 Shirt", options: [["fast", "$8 fast-fashion shirt"], ["quality", "$32 well-made shirt"]], value: "fast", short: "Shirt",
            fmt: v => v === "fast" ? "$8 shirt" : "$32 shirt" },
          { type: "range", id: "wears", label: "🔁 Times worn", min: 5, max: 60, step: 5, value: 10, short: "Wears" } ],
        model: c => { const [price, life] = c.shirt === "fast" ? [8, 10] : [32, 60]; return price * Math.ceil(c.wears / life) / c.wears; },
        noise: 0, digits: 2, prefix: "$",
        x: { id: "wears", label: "Times worn", min: 0, max: 60, tick: 10 },
        y: { label: "Cost per wear ($)", min: 0, max: 7, tick: 1 },
        readout: "Cost per wear", yShort: "Cost/wear",
        group: c => c.shirt === "fast" ? "$8 fast-fashion shirt" : "$32 well-made shirt",
        need: { distinct: 5, groups: 2 }, needLabel: "Recorded 5+ wear amounts for BOTH shirts",
        scene: `<svg viewBox="0 0 320 220" style="width:100%;display:block">
          <g id="stack"></g>
          <text id="bought" x="160" y="170" text-anchor="middle" font-family="Nunito" font-weight="800" font-size="13" fill="#5d6577"></text>
          <text id="spent" x="160" y="194" text-anchor="middle" font-family="Fredoka, Nunito" font-weight="700" font-size="20" fill="#1f2430"></text>
          <text x="160" y="212" text-anchor="middle" font-family="Nunito" font-weight="700" font-size="11" fill="#5d6577">total spent</text>
        </svg>`,
        draw(svg, c) {
          const [price, life, col] = c.shirt === "fast" ? [8, 10, "#e8368f"] : [32, 60, "#0e9f6e"];
          const n = Math.ceil(c.wears / life);
          const shirt = (x, y) => `<path transform="translate(${x} ${y}) scale(.9)" d="M10 0 L0 8 L6 18 L12 14 L12 44 L44 44 L44 14 L50 18 L56 8 L46 0 L36 0 Q28 8 20 0 Z" fill="${col}" stroke="#1f2430" stroke-width="2"/>`;
          let h = ""; for (let i = 0; i < n; i++) h += shirt(30 + (i % 6) * 44, 20 + Math.floor(i / 6) * 52);
          svg.querySelector("#stack").innerHTML = h;
          svg.querySelector("#bought").textContent = `${n} shirt${n > 1 ? "s" : ""} bought for ${c.wears} wears`;
          svg.querySelector("#spent").textContent = "$" + (price * n).toFixed(2);
        }
      },
      analyze: {
        placeholder: "My graph shows that the two lines meet at about ___ wears. After that… This supports / weakens the author's rebuttal because…",
        hint: "Explain where the lines meet and what that means for shoppers. Use the phrase <b>cost per wear</b>.",
        must: /cost per wear/i, minWords: 25, checkLabel: "Analyzed the graph (25+ words, uses \"cost per wear\")",
        stems: [ "What would happen if…", "How would the results change if…", "Who benefits when…", "What if clothing companies…" ]
      }
    },

    C: {
      title: "Philosophical Chairs", time: "5–8 min",
      goal: "Take a position, back it up with <b>evidence</b>, and respond respectfully to a classmate's argument.",
      statement: "Teenagers should stop buying fast fashion completely.",
      reasonStarter: "I agree / disagree because…",
      peer: { name: "Kai", says: "That's unrealistic. Most teens can't afford expensive clothes, and secondhand stores don't always have what we need." },
      frames: FRAMES
    },

    O: {
      title: "Organize It", time: "5–8 min",
      goal: "Build an <b>argument map</b> by sorting each sentence into its role, then write a <b>summary</b>.",
      sortTitle: "Build the argument map",
      zones: [ "📣 Claim", "↩️ Counterclaim", "🛡️ Rebuttal", "📊 Evidence" ],
      tiles: [ ["Fast fashion costs far more than its price tag.", 0],
               ["Fast fashion makes stylish clothing affordable for tight budgets.", 1],
               ["Some say most people can't afford better-made clothes.", 1],
               ["Buying fewer, better-made items can save money over time.", 2],
               ["Secondhand shopping is affordable AND reduces waste.", 2],
               ["Americans threw away about 17 million tons of textiles in 2018.", 3],
               ["Fashion produces 2 to 8 percent of global greenhouse gas emissions.", 3],
               ["The Rana Plaza collapse killed more than 1,100 workers.", 3] ],
      summaryPrompt: "Write 2–3 sentences summarizing the author's argument, including the counterclaim and how the author rebuts it.",
      summaryStarter: "The author argues that…"
    }
  }
};
function words(s) { return (String(s).trim().match(/[A-Za-z0-9'’%₂₆-]+/g) || []).length; }
</script>
<script src="hub-config.js?v=3"></script>
<script src="wicor-lesson.js?v=3"></script>
</body>
</html>
