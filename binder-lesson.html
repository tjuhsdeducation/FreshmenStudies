<script>
/* =====================================================================
   ✏️ EVERYTHING HAS A PLACE: Organizing Your AVID Binder (about 50 min)
   Change the class tabs in the sort to match your school if you like.
   ===================================================================== */
const BINDER_SVG = `<svg viewBox="0 0 520 260" role="img" aria-label="An open AVID binder with a supply pouch, planner, AVID tab, and a tab for each class in period order" style="width:100%;height:auto;display:block">
  <rect x="10" y="20" width="500" height="225" rx="16" fill="#3b4a8a"/><rect x="24" y="32" width="472" height="200" rx="10" fill="#fffdf6"/>
  ${[60, 130, 200].map(y => `<circle cx="40" cy="${y + 10}" r="9" fill="#c0c6d4" stroke="#8a90a0"/>`).join("")}
  <rect x="60" y="44" width="110" height="60" rx="8" fill="#ffd9e8" stroke="#e8368f"/><text x="115" y="70" text-anchor="middle" font-family="Nunito,Arial" font-weight="800" font-size="12" fill="#2a2433">✏️ Supply pouch</text><text x="115" y="88" text-anchor="middle" font-family="Nunito,Arial" font-size="10" fill="#5d5470">pencils · pens · highlighters</text>
  <rect x="60" y="114" width="110" height="108" rx="8" fill="#fff3c4" stroke="#e0a800"/><text x="115" y="140" text-anchor="middle" font-family="Nunito,Arial" font-weight="800" font-size="12" fill="#2a2433">🗓️ Planner</text><text x="115" y="158" text-anchor="middle" font-family="Nunito,Arial" font-size="10" fill="#5d5470">every class, every day</text><text x="115" y="190" text-anchor="middle" font-family="Nunito,Arial" font-weight="800" font-size="11" fill="#2a2433">📂 To-Do pocket</text>
  ${[["AVID", "#8a54e0"], ["P1 English", "#2b7de9"], ["P2 Math", "#0e9f6e"], ["P3 Science", "#e08a00"], ["P4 History", "#e8368f"], ["P5 Spanish", "#1aa3c6"]].map((t, i) => `<rect x="${190 + i * 50}" y="44" width="46" height="178" rx="6" fill="${t[1]}" opacity=".18" stroke="${t[1]}"/><rect x="${190 + i * 50}" y="${44 + i * 0}" width="46" height="24" rx="6" fill="${t[1]}"/><text x="${213 + i * 50}" y="60" text-anchor="middle" font-family="Nunito,Arial" font-weight="900" font-size="8.5" fill="#fff">${t[0]}</text>
    <text transform="translate(${216 + i * 50} 150) rotate(-90)" text-anchor="middle" font-family="Nunito,Arial" font-weight="700" font-size="10" fill="#2a2433">notes · work · quizzes</text>`).join("")}
</svg>`;

window.CC = {
  id: "avid-binder", subject: "AVID", kind: "Organization Lesson", brand: { name: "AVID", home: "avid", mark: "🗂️" },
  short: "Everything Has a Place", color: "#0e9f6e", emoji: "🗂️", time: "≈ 50 min",
  title: "Everything Has a Place: Organizing Your AVID Binder",
  intro: "Learn the AVID binder system, sort real papers behind the right tabs, set up a class section, and build a weekly clean-out routine you can keep all year.",
  eq: "How does keeping everything in its place help me study, stay on top of work, and save time?",
  targets: {
    R: "I can explain how an AVID binder is organized and why.",
    O: "I can file notes, returned work, and handouts behind the correct tabs.",
    I: "I can decide what to keep, what to take home, and what to recycle.",
    C: "I can check a partner’s binder and give helpful feedback.",
    W: "I can write a plan to keep my binder organized."
  },
  teacher: `<p><b>Pacing (≈ 50 min):</b> Four Corners 5 · Read 8 · Sort the papers 10 · Inside a class tab 6 · Weekly routine 6 · Binder buddy check 10 · Exit 5.</p>
    <p><b>Materials:</b> students’ real binders for the buddy check. The class tabs in the sort are examples; your students’ tabs should follow their own schedule.</p>`,
  stations: [
    { letters: ["C"], title: "Warm-Up: Four Corners", time: "5 min", goal: "Be honest: what does your backpack look like right now?",
      blocks: [ { t: "move", mode: "corners", seconds: 120, prompt: "Right now, my backpack and binder are…", options: ["😎 Neat: everything has a place", "🙂 Mostly organized", "😬 Organized chaos", "🌪️ Paper avalanche!"],
        talk: "What is one thing that makes it hard to stay organized? What is one trick that works for you?", reflect: "Which corner did you choose, and what organizing trick did you hear from someone else?" } ] },
    { letters: ["R"], title: "Read: The AVID Binder System", time: "8 min", goal: "Learn where everything goes and why.",
      blocks: [
        { t: "text", html: `${BINDER_SVG}
          <p>An AVID binder works because <b>everything has a place, and you always put it there</b>. When you need something, you know exactly where to look.</p>
          <p><b>Front of the binder:</b> a zipper <b>supply pouch</b> (pencils, pens, highlighters, eraser, paper), your <b>planner</b>, and a <b>To-Do pocket</b> for work that is due soon or papers that go home and come back (like permission slips).</p>
          <p><b>AVID tab:</b> TRFs, tutorial work and reflections, learning logs, and binder checks.</p>
          <p><b>One tab for each class, in period order.</b> Inside each class tab, keep the same order every time: the syllabus and handouts first, then <b>focused notes</b> dated and in order, then classwork and homework, then <b>returned quizzes and tests</b> with corrections. Your teacher may ask for a slightly different order. What matters is that you use the same system in every tab.</p>
          <p><b>Keep returned work until the unit test or final.</b> Old quizzes are study guides! At the end of a unit, move finished work to a <b>home file</b> (a box or folder at home) so your binder doesn’t overflow. Only recycle work after you no longer need it for the final.</p>` },
        { t: "quiz", label: "reading check", items: [
          { q: "Where should a returned, graded math quiz go?", opts: ["Recycling bin", "Behind the math tab with your quizzes, after you do corrections", "In the supply pouch", "Loose in your backpack"], a: 1, why: "Returned quizzes are study guides until the unit test or final." },
          { q: "What goes in the To-Do pocket?", opts: ["Work due soon and papers that go home and come back", "Last semester’s notes", "Your pencils", "Every paper you get"], a: 0, why: "The To-Do pocket keeps urgent items in one place." },
          { q: "Why keep the same order inside every class tab?", opts: ["It looks nice", "So you always know exactly where to find notes, work, and quizzes", "Teachers require random order", "It saves paper"], a: 1, why: "A consistent system saves time and stress." }] }
      ] },
    { letters: ["O", "I"], title: "Sort the Papers", time: "10 min", goal: "Every paper has a place. Put each one behind the right tab.",
      blocks: [ { t: "sort", label: "binder sort", look: "binder", title: "Where does it go?", colors: ["#e0a800", "#8a54e0", "#2b7de9", "#0e9f6e", "#e08a00", "#e8368f", "#5d6577"],
        zones: ["🗓️ Planner", "🎓 AVID tab", "📘 English", "📐 Math", "🔬 Science", "📂 To-Do pocket", "🏠 Home file"],
        tiles: [["Homework for this week written in", 0], ["Test dates for the month", 0], ["TRF for tomorrow’s tutorial", 1], ["Tutorial reflection from last week", 1], ["Focused notes: Romeo and Juliet Act 1 (10/3)", 2], ["Returned essay with rubric", 2],
          ["Focused notes: Solving systems (10/2)", 3], ["Returned Algebra quiz with corrections", 3], ["Focused notes: Cell transport (10/1)", 4], ["Lab report rubric for the cell lab", 4],
          ["Field trip permission slip to get signed", 5], ["Science vocab homework due tomorrow", 5], ["Report card", 6], ["Last semester’s notes after the final", 6]],
        why: "When a paper has a date and a class, it has a home. If you’re not sure, ask: “Will I need this to study?”" } ] },
    { letters: ["O"], title: "Inside a Class Tab", time: "6 min", goal: "Set up one class section from front to back.",
      blocks: [ { t: "order", title: "Put the Science tab in order (front to back)", how: "This is one common AVID setup. Your teacher may use a different order; the key is to use the same order in every tab.",
        items: ["Class syllabus and grading policy", "Unit handouts and vocabulary list", "Focused notes, dated and in order", "Classwork and homework", "Returned quizzes and tests, with corrections"], why: "Reference first, then notes, then practice, then feedback." } ] },
    { letters: ["O", "I"], title: "Your Weekly Clean-Out Routine", time: "6 min", goal: "Ten minutes a week keeps the paper avalanche away.",
      blocks: [
        { t: "order", title: "Friday binder clean-out: put the steps in order", items: ["Empty your backpack and binder pockets", "Sort every loose paper behind its tab", "Do corrections on any returned quizzes", "Move finished-unit work to your home file", "Restock your supply pouch", "Check your grades and plan next week in your planner"],
          why: "Empty, sort, fix, file, restock, plan." },
        { t: "quiz", label: "keep or toss", title: "Keep, file at home, or recycle?", items: [
          { q: "A returned vocab quiz from this unit (test next week).", opts: ["Keep in the binder", "Home file", "Recycle"], a: 0, why: "You need it to study for next week’s test." },
          { q: "Unit 1 notes, and the Unit 1 test was last month (final is in May).", opts: ["Keep in the binder", "Home file", "Recycle"], a: 1, why: "Save it for the final, but get it out of your binder." },
          { q: "A flyer for a club meeting that already happened.", opts: ["Keep in the binder", "Home file", "Recycle"], a: 2, why: "No longer useful." }] }
      ] },
    { letters: ["C"], title: "Binder Buddy Check", time: "10 min", goal: "Trade binders with a partner and check each other’s system.",
      blocks: [
        { t: "checklist", title: "Check your partner’s binder", how: "Check each item that is true for your partner’s binder. Be kind and specific.", items: ["Supply pouch has pencils, pens, and highlighters", "Planner has this week’s work for every class", "Tabs are in period order with AVID first", "Focused notes are dated and in order", "Returned quizzes are behind the right tabs", "No loose papers in pockets or the backpack"] },
        { t: "partner", title: "Buddy feedback", how: "Write the most helpful tip your buddy gave you.", got: "My buddy noticed…", change: "This week I will fix…" }
      ] },
    { letters: ["W"], title: "Exit Ticket", time: "5 min", goal: "Make your plan.",
      blocks: [ { t: "write", label: "exit ticket", title: "My binder plan", prompt: "What is one thing you will change about your binder this week, when will you do your weekly clean-out, and how will an organized binder help you study?", min: 35,
        checks: [{ label: "Names a change", re: /tab|pouch|planner|notes|quiz|pocket|sort|file|order|label|date/i }, { label: "Names a day or time for the clean-out", re: /monday|tuesday|wednesday|thursday|friday|saturday|sunday|weekend|every|after school|night|morning/i }, { label: "Connects organization to studying", re: /study|test|quiz|find|review|grade|time|stress/i }] } ] }
  ]
};

</script>
