<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Score Sync Test</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--fg:#1f2430;--muted:#5d6577;--line:#dfe3ea;--accent:#2f5bd3;--ok:#2e7d32}
  @media (prefers-color-scheme: dark){:root{--bg:#17151f;--card:#211e2b;--fg:#ece9f5;--muted:#aaa5bd;--line:#352f45;--accent:#a9b4ff;--ok:#7bd88f}}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,"Segoe UI",sans-serif}
  main{max-width:560px;margin:24px auto;padding:0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
  h1{margin:0 0 4px;font-size:1.5rem} p{color:var(--muted)}
  label{display:grid;gap:4px;font-weight:700;margin:10px 0}
  input,select{font:inherit;padding:10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--fg)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button{font:inherit;font-weight:800;border:0;border-radius:12px;padding:12px 16px;background:var(--accent);color:#fff;cursor:pointer;margin-top:12px;width:100%}
  button:disabled{opacity:.5}
  #msg{font-weight:700;margin-top:12px}
  code{background:var(--bg);padding:1px 5px;border-radius:5px}
</style>
</head>
<body>
<main><div class="card">
  <h1>🧪 Score Sync Test</h1>
  <p>Sends a fake score to Google Sheets so you can check the setup. It shows up in <b>Drive → Freshmen Studies Scores → (school) → Formative Scores - (teacher)</b> on the tab <b>“TEST – Score Sync Check,”</b> and in the master sheet’s <b>All submissions</b> tab.</p>
  <form id="f">
    <div class="row"><label>First name<input id="first" value="Test" required></label><label>Last name<input id="last" value="Student" required></label></div>
    <div class="row"><label>Period<select id="period" required></select></label><label>Student ID<input id="sid" value="000123" required></label></div>
    <label>School<select id="school" required></select></label>
    <label>Teacher<select id="teacher" required><option value="">Choose a school first</option></select></label>
    <button type="submit">📤 Send test score</button>
  </form>
  <div id="msg" aria-live="polite"></div>
  <p id="url" style="font-size:.85rem"></p>
</div></main>

<!-- 1) shared settings (teacher list + web app URL)  2) the shared sender -->
<script src="sheets-config.js"></script>
<script src="sheets-send.js"></script>
<script>
  const $ = id => document.getElementById(id);
  $('period').innerHTML = '<option value="">Choose…</option>' + [1,2,3,4,5,6,7,8].map(p => `<option>${p}</option>`).join('');
  $('school').innerHTML = '<option value="">Choose…</option>' + Object.keys(SCHOOLS).map(s => `<option>${s}</option>`).join('');
  $('school').onchange = () => fillTeacherDropdown($('teacher'), $('school').value);   // teacher dropdown reads from sheets-config.js
  $('url').innerHTML = SHEETS_WEBHOOK_URL ? 'Sending to: <code>' + SHEETS_WEBHOOK_URL.slice(0, 60) + '…</code>' : '⚠️ <b>SHEETS_WEBHOOK_URL is empty</b> in sheets-config.js, so this only saves on this computer (preview mode).';
  $('f').onsubmit = async e => {
    e.preventDefault();
    const b = e.submitter || document.querySelector('button'); b.disabled = true; $('msg').textContent = 'Sending…';
    const r = await sendScoreToSheets({
      studentId: $('sid').value.trim(), firstName: $('first').value.trim(), lastName: $('last').value.trim(),
      period: $('period').value, teacher: $('teacher').value, school: $('school').value,
      activity: 'TEST – Score Sync Check', score: 4, total: 5,
      qlabels: ['Q1 Warm-up', 'Q2 Vocabulary', 'Q3 Scenario'], qpoints: [1, 2, 1], qmax: [1, 2, 2],
      locks: 0, responses: 'This is a test submission.'
    });
    $('msg').innerHTML = r.preview ? '💾 Saved in preview mode only (no URL yet).' : r.ok ? '✅ Sent! Check the teacher’s spreadsheet in about 10 seconds. Send again: the teacher tab still shows the student once (newest kept), and the master logs both.' : '📶 No connection. It will retry automatically.';
    b.disabled = false;
  };
</script>
</body>
</html>
