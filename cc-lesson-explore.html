    { letters: ["R"], title: "Read: California’s Three Public College Systems", time: "12 min", goal: "Read the article and the chart, then check your understanding.",
      blocks: [
        { t: "text", html: `<h3>Three Systems, One Big Promise</h3>
          <p>California has one of the largest public college systems in the world. It is built so that every high school graduate has a place to go next. There are three public systems, and many students move between them.</p>
          <p><b>California Community Colleges (116 colleges).</b> Community colleges are open to anyone with a high school diploma or who is 18 or older, and they do not require the SAT or ACT. Students can earn a career certificate (such as welding, medical assisting, or automotive technology) in a year or less, an associate degree (about 60 units, or two years full-time), or get ready to transfer to a university. The enrollment fee is about $46 per unit, and many students qualify for the <b>California College Promise Grant</b>, which waives that fee. Near Tulare: <b>College of the Sequoias</b> (Visalia, the Tulare College Center, and Hanford) and <b>Porterville College</b>.</p>
          <p><b>California State University, or CSU (22 universities).</b> CSU campuses offer bachelor’s and master’s degrees and are known for hands-on, career-focused programs like nursing, engineering, agriculture, business, and teaching. First-year students need 15 <b>A–G</b> courses with a C or better. Systemwide tuition for 2025–26 is $6,450, plus campus fees. Near Tulare: <b>Fresno State</b> and <b>CSU Bakersfield</b>.</p>
          <p><b>University of California, or UC (10 campuses, 9 with undergraduates).</b> UC campuses are research universities. They offer bachelor’s, master’s, and doctoral degrees, plus professional schools such as medicine and law. Admission is more competitive and includes the Personal Insight Questions. Tuition and fees for new students in 2025–26 are $14,934, plus campus fees. The closest UC to Tulare County is <b>UC Merced</b>, the newest UC, which opened in 2005.</p>
          <p><b>Transfer is a smart path.</b> Many students start at a community college and transfer. An <b>Associate Degree for Transfer (ADT)</b> guarantees admission to the CSU system (not always the campus you want most), and six UC campuses offer a <b>Transfer Admission Guarantee (TAG)</b>.</p>
          <p><b>Private colleges</b>, such as Fresno Pacific University, have a higher sticker price, but many students receive grants. For every college, the price before financial aid is not what most students pay. The FAFSA or California Dream Act opens the door to Pell Grants, Cal Grants, and more.</p>
