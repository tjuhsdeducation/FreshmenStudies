<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Angle Detectives | WICOR Geometry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="wicor-lesson.css">
</head>
<body>
<script>
/* =====================================================================
   ✏️ LESSON CONTENT: Parallel Lines & Transversals (Geometry)
   Reading station = an angle diagram (visual reading).
   Angles 1–4 are at the top intersection, 5–8 at the bottom
   (top-left, top-right, bottom-left, bottom-right).
   ===================================================================== */
const FRAMES = [ "I agree with ___ because…", "I respectfully disagree because…", "Can you explain which angle pair…?",
                 "I'd like to build on that idea…", "What evidence do you have that…?", "I used to think ___, but now I think…" ];
const LESSON = {
  id: "geo-angle-detectives",
  subject: "Geometry",
  short: "Geometry: Angle Detectives",
  color: "#e0408a",
  emoji: "📐",
  eq: "How do angle relationships help us prove that lines are parallel and find unknown angles?",
  targets: {
    R: "I can read an angle diagram and identify corresponding, vertical, alternate interior, alternate exterior, and same-side interior angles.",
    W: "I can write a CER that uses angle relationships to prove two lines are parallel.",
    I: "I can predict, test, and graph how angle pairs change when a transversal moves.",
    C: "I can use geometric reasoning to support my position and respond respectfully to a peer.",
    O: "I can classify angle pairs as congruent or supplementary."
  },
  title: "Angle Detectives: Parallel Lines & Transversals",
  intro: "City planners need to know if two new roads are parallel. Read an angle diagram, prove it in writing, run an angle lab, debate, and organize the angle pairs. Five stations, about 5–10 minutes each.",
  order: ["R", "W", "I", "C", "O"],
  stations: {

    R: {
      mode: "visual", kind: "diagram",
      title: "Read the Diagram", time: "8 min",
      goal: "Read the angle diagram. Complete each task by clicking the matching angle.",
      figureTitle: "Two parallel lines cut by a transversal",
      intro: "Lines <i>m</i> and <i>n</i> are parallel. Line <i>t</i> is the transversal. Each angle is numbered. Pick a task, then click an angle number.",
      figure: `<svg viewBox="0 0 440 300" role="img" aria-label="Two parallel lines m and n cut by transversal t forming angles 1 through 8">
        <line x1="20" y1="100" x2="420" y2="100" stroke="#2b7de9" stroke-width="4"/><line x1="20" y1="210" x2="420" y2="210" stroke="#2b7de9" stroke-width="4"/>
        <path d="M400 94 l10 6 l-10 6" fill="none" stroke="#2b7de9" stroke-width="3"/><path d="M400 204 l10 6 l-10 6" fill="none" stroke="#2b7de9" stroke-width="3"/>
        <line x1="135" y1="20" x2="295" y2="290" stroke="#e0408a" stroke-width="4"/>
        <g font-family="Nunito, sans-serif" font-weight="900" font-size="15" fill="#1f2430">
          <text x="26" y="92" fill="#2b7de9">m</text><text x="26" y="202" fill="#2b7de9">n</text><text x="290" y="282" fill="#e0408a">t</text>
        </g>
        ${[["a1",162,88],["a2",204,88],["a3",160,124],["a4",202,124],["a5",226,198],["a6",268,198],["a7",224,234],["a8",266,234]].map(([k,x,y],i) =>
          `<g data-hot="${k}"><circle cx="${x}" cy="${y - 5}" r="15" fill="#fff" stroke="#c7cbd6" stroke-width="2"/><text x="${x}" y="${y}" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="15" fill="#1f2430">${i + 1}</text></g>`).join("")}
        <text x="20" y="290" font-family="Nunito" font-weight="800" font-size="13" fill="#5d6577">m ∥ n</text>
      </svg>`,
      tasks: [
        { q: "Click the angle that <b>corresponds</b> to ∠1.", hot: "a5", hint: "Corresponding angles are in the same position at each intersection (top-left matches top-left).", why: "∠1 and ∠5 are both in the top-left position, so they are corresponding angles." },
        { q: "Click the angle <b>vertical</b> to ∠1.", hot: "a4", hint: "Vertical angles are across from each other at the same intersection.", why: "∠1 and ∠4 are opposite each other: vertical angles." },
        { q: "Click the angle <b>alternate interior</b> to ∠3.", hot: "a6", hint: "Alternate interior angles are between the parallel lines, on opposite sides of the transversal.", why: "∠3 and ∠6 are inside the parallel lines on opposite sides of t." },
        { q: "Click the angle <b>alternate exterior</b> to ∠1.", hot: "a8", hint: "Alternate exterior angles are outside the parallel lines, on opposite sides of t.", why: "∠1 and ∠8 are outside the parallel lines on opposite sides of t." },
        { q: "Click the angle that forms a <b>same-side interior</b> pair with ∠4.", hot: "a6", hint: "Same-side interior angles are between the parallel lines on the SAME side of t.", why: "∠4 and ∠6 are both inside the parallel lines on the right side of t, so they add to 180°." }
      ],
      gist: "In one sentence, describe one pattern you notice about the angles in this diagram."
    },

    W: {
      title: "Write a CER Paragraph", time: "8–10 min",
      goal: "Use angle relationships to write a <b>Claim–Evidence–Reasoning</b> paragraph that proves whether two roads are parallel.",
      prompt: "Two new roads are crossed by Main Street. A surveyor measures a pair of same-side interior angles as 62° and 118°. Are the two roads parallel? Prove it.",
      parts: [
        { key: "claim", label: "Claim", sub: "Answer the question", starter: "The two roads are / are not parallel because…",
          hint: "One sentence: parallel or not?", checkLabel: "Claim says parallel or not (6+ words)",
          check: v => words(v) >= 6 && /parallel/i.test(v) },
        { key: "evidence", label: "Evidence", sub: "Show the angle math", rows: 3, starter: "62° + 118° = …",
          hint: "Add the two same-side interior angles and compare to 180°.",
          checkLabel: "Evidence uses 62, 118, and 180",
          check: v => words(v) >= 5 && /62/.test(v) && /118/.test(v) && /180/.test(v) },
        { key: "reasoning", label: "Reasoning", sub: "Which rule proves it?", rows: 3, starter: "This shows that… because when same-side interior angles are supplementary…",
          hint: "Name the angle relationship rule and explain why it proves the lines are parallel.",
          checkLabel: "Reasoning names the rule (uses \"because\" and \"supplementary\")",
          check: v => words(v) >= 15 && /because|this shows|therefore|which means/i.test(v) && /supplementary|180/i.test(v) }
      ],
      minTerms: 2, minWords: 40,
      terms: [ ["supplementary", /supplementary/i], ["same-side interior", /same.side interior/i], ["transversal", /transversal/i], ["parallel", /parallel/i], ["converse", /converse/i], ["congruent", /congruent/i] ]
    },

    I: {
      title: "Predict, Test & Graph", time: "10 min",
      goal: "Rotate the transversal and investigate how angle pairs change. Predict, run the lab, graph it, and ask a <b>Level 3 question</b>.",
      predict: {
        q: "Predict: As ∠1 gets bigger, what happens to ∠2 (its linear pair)?",
        placeholder: "If ∠1 increases, then ∠2 will … because …",
        options: [
          { v: "down", label: "∠2 gets smaller (straight line down)", d: "M14 10 L106 56" },
          { v: "up", label: "∠2 gets bigger too", d: "M14 56 L106 10" },
          { v: "same", label: "∠2 stays the same", d: "M14 34 L106 34" },
          { v: "curve", label: "∠2 drops faster and faster", d: "M14 10 C 50 12, 80 24, 106 58" } ]
      },
      lab: {
        title: "Test it: Angle Lab",
        intro: "Turn the transversal by changing ∠1. Choose which angle to measure. Record <b>at least 5 values of ∠1 for BOTH angle pairs</b>. Where do the two lines on your graph cross?",
        controls: [
          { type: "seg", id: "pair", label: "📐 Measure which angle?", options: [["lp", "∠2 (linear pair)"], ["corr", "∠5 (corresponding)"]], value: "lp", short: "Angle", fmt: v => v === "lp" ? "∠2" : "∠5" },
          { type: "range", id: "a1", label: "↻ ∠1", min: 30, max: 150, step: 10, value: 60, unit: "°", short: "∠1" } ],
        model: c => c.pair === "lp" ? 180 - c.a1 : c.a1,
        noise: 0, digits: 0,
        x: { id: "a1", label: "∠1 (degrees)", min: 0, max: 180, tick: 30 },
        y: { label: "Measured angle (degrees)", min: 0, max: 180, tick: 30 },
        readout: "Measured angle", unit: "°", yShort: "Angle",
        group: c => c.pair === "lp" ? "∠2 (linear pair)" : "∠5 (corresponding)",
        need: { distinct: 5, groups: 2 }, needLabel: "Recorded 5+ values of ∠1 for BOTH angles",
        scene: `<svg viewBox="0 0 320 200" style="width:100%;display:block">
          <line x1="10" y1="70" x2="310" y2="70" stroke="#2b7de9" stroke-width="3"/><line x1="10" y1="150" x2="310" y2="150" stroke="#2b7de9" stroke-width="3"/>
          <line id="tr" x1="100" y1="10" x2="220" y2="190" stroke="#e0408a" stroke-width="3"/>
          <path id="arc1" fill="none" stroke="#8a54e0" stroke-width="4"/><path id="arc2" fill="none" stroke="#ee7d1c" stroke-width="4"/>
          <text id="t1" font-family="Nunito" font-weight="900" font-size="12" fill="#8a54e0"></text><text id="t2" font-family="Nunito" font-weight="900" font-size="12" fill="#ee7d1c"></text>
        </svg>`,
        draw(svg, c) {
          /* ∠1 is the top-left angle at the upper intersection: between the leftward ray and the upward ray of t */
          const th = (180 - c.a1) * Math.PI / 180, ux = Math.cos(th), uy = -Math.sin(th);   // upward ray of t (screen coords)
          const P1 = [160, 70], t = 80 / Math.sin(th), P2 = [160 - ux * t, 150], r = 22;
          const tr = svg.querySelector("#tr");
          tr.setAttribute("x1", P1[0] + ux * 55); tr.setAttribute("y1", P1[1] + uy * 55);
          tr.setAttribute("x2", P2[0] - ux * 55); tr.setAttribute("y2", P2[1] - uy * 55);
          const pt = (P, ang) => [P[0] + r * Math.cos(ang), P[1] - r * Math.sin(ang)];
          const arc = (P, from, to) => { const [x1, y1] = pt(P, from), [x2, y2] = pt(P, to); return `M${x1} ${y1} A${r} ${r} 0 0 1 ${x2} ${y2}`; };
          svg.querySelector("#arc1").setAttribute("d", arc(P1, Math.PI, th));
          const t1 = svg.querySelector("#t1"); t1.setAttribute("x", P1[0] - 78); t1.setAttribute("y", P1[1] - 10); t1.textContent = "∠1 = " + c.a1 + "°";
          const t2 = svg.querySelector("#t2");
          if (c.pair === "lp") {
            svg.querySelector("#arc2").setAttribute("d", arc(P1, th, 0));
            t2.setAttribute("x", P1[0] + 24); t2.setAttribute("y", P1[1] - 10); t2.textContent = "∠2 = " + (180 - c.a1) + "°";
          } else {
            svg.querySelector("#arc2").setAttribute("d", arc(P2, Math.PI, th));
            t2.setAttribute("x", P2[0] - 78); t2.setAttribute("y", P2[1] - 10); t2.textContent = "∠5 = " + c.a1 + "°";
          }
        }
      },
      analyze: {
        placeholder: "The ∠2 line goes down because… The ∠5 line goes up because… The lines cross at 90° because…",
        hint: "Explain both lines on your graph using <b>supplementary</b> (adds to 180°) and <b>congruent</b> (equal). Why do they cross at 90°?",
        must: /supplementary|congruent|180|equal/i, minWords: 25, checkLabel: "Analyzed the graph (25+ words, uses \"supplementary\" or \"congruent\")",
        stems: [ "What would happen if…", "How would the graph change if the lines were not parallel…", "Why do the lines cross at…", "Predict ∠8 when…" ]
      }
    },

    C: {
      title: "Philosophical Chairs", time: "5–8 min",
      goal: "Take a position, back it up with <b>evidence</b>, and respond respectfully to a classmate's argument.",
      statement: "Geometry is mostly memorizing rules. It doesn't really teach you how to think.",
      reasonStarter: "I agree / disagree because in this lesson I noticed…",
      peer: { name: "Sam", says: "Angle rules are just vocabulary. Once you memorize which pairs are equal, there's nothing else to understand." },
      frames: FRAMES
    },

    O: {
      title: "Organize It", time: "5–8 min",
      goal: "Sort each angle pair (when the lines are parallel) as <b>congruent</b> or <b>supplementary</b>, then write a <b>summary</b>.",
      sortTitle: "Congruent or supplementary? (Lines m and n are parallel.)",
      zones: [ "≅ Congruent (equal)", "➕ Supplementary (add to 180°)" ],
      tiles: [ ["Corresponding angles", 0], ["Alternate interior angles", 0], ["Alternate exterior angles", 0], ["Vertical angles", 0], ["∠2 and ∠6", 0], ["∠1 and ∠8", 0],
               ["Same-side interior angles", 1], ["Linear pair", 1], ["∠4 and ∠6", 1], ["∠1 and ∠2", 1] ],
      summaryPrompt: "Write 2–3 sentences explaining which angle pairs are congruent, which are supplementary, and how that helps prove lines are parallel.",
      summaryStarter: "When two parallel lines are cut by a transversal…"
    }
  }
};
function words(s) { return (String(s).trim().match(/[A-Za-z0-9'’%₂₆−-]+/g) || []).length; }
</script>
<script src="hub-config.js?v=3"></script>
<script src="wicor-lesson.js?v=3"></script>
</body>
</html>
