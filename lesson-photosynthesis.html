<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photosynthesis | WICOR Biology</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="wicor-lesson.css">
</head>
<body>
<script>
/* =====================================================================
   ✏️ LESSON CONTENT: Photosynthesis (Biology)
   To make a new lesson: copy this whole file, rename it, and change the
   text below. In the article:
     [C] = the claim sentence   [E] = evidence   [R] = reasoning
     {{word}} = a key term students should circle
   ===================================================================== */
const LESSON = {
  id: "bio-photosynthesis",
  subject: "Biology",
  short: "Biology: Photosynthesis",
  color: "#1aa36f",
  emoji: "🌿",
  eq: "Why is photosynthesis so important to nearly all life on Earth?",
  targets: {"R": "I can identify the claim, evidence, and reasoning in a science article and annotate key terms.", "W": "I can write a CER paragraph explaining what would happen to life on Earth without photosynthesis.", "I": "I can predict, test, and graph how light intensity affects the rate of photosynthesis.", "C": "I can use evidence from my lab to support my position and respond respectfully to a peer.", "O": "I can organize the inputs, outputs, location, and limiting factors of photosynthesis."},
  title: "Photosynthesis: The Factory in Every Leaf",
  intro: "Read, write, question, discuss, and organize your way through one of the most important processes on Earth. Complete all five stations, about 5–10 minutes each.",
  order: ["R", "W", "I", "C", "O"],   /* the order students move through the stations */

  stations: {

    /* ---------- R: READING ---------- */
    R: {
      title: "Read & Annotate", time: "8–10 min",
      goal: "Read the article and mark it up like an AVID scholar: underline the <b>claim</b>, highlight <b>evidence</b> and <b>reasoning</b>, circle <b>key terms</b>, and write at least one <b>margin note</b>.",
      minKeys: 5,
      gist: "In one sentence, what does the author want you to believe about photosynthesis?",
      article: {
        title: "The Factory in Every Leaf",
        byline: "Biology · AVID WICOR reading",
        paragraphs: [
          [ "Every breath you take connects you to a leaf.",
            "Plants, algae, and some bacteria carry out {{photosynthesis}}, a process that captures light energy and stores it as chemical energy in sugar.",
            "[C] Photosynthesis is the most important chemical process on Earth, because nearly every living thing depends on the food and oxygen it produces." ],
          [ "Photosynthesis takes place inside {{chloroplasts}}, tiny structures found in the cells of leaves.",
            "Chloroplasts contain a green pigment called {{chlorophyll}}, which absorbs mostly red and blue light and reflects green light.",
            "Using that captured energy, the plant combines {{carbon dioxide}} from the air with water from the soil to build {{glucose}}, a sugar, and releases oxygen as a by-product.",
            "Scientists summarize the process with this equation: 6CO₂ + 6H₂O + light energy → C₆H₁₂O₆ + 6O₂." ],
          [ "[E] The glucose made by plants is the starting point of almost every food chain; a rabbit eating clover and a student eating a salad are both using energy that photosynthesis first captured from the sun.",
            "[E] Scientists estimate that at least half of the oxygen produced on Earth comes from the ocean, mostly from tiny drifting organisms called {{phytoplankton}}.",
            "[E] Even the gasoline in cars and the coal burned in some power plants formed from ancient organisms whose energy came from photosynthesis millions of years ago." ],
          [ "[R] Because living things cannot make energy from nothing, they must get it from somewhere, and photosynthesis is the main way the sun's energy enters living systems.",
            "[R] Without it, plants would stop growing, the animals that eat plants would starve, and the predators that eat those animals would soon follow." ],
          [ "The speed of photosynthesis is not fixed.",
            "It depends on {{limiting factors}} such as light intensity, carbon dioxide concentration, and temperature.",
            "In dim light, adding more light speeds photosynthesis up, but eventually the plant reaches a point where extra light no longer helps because something else becomes the limit.",
            "So the next time you eat lunch or take a deep breath, remember the tiny factories working in every green leaf." ]
        ]
      }
    },

    /* ---------- W: WRITING ---------- */
    W: {
      title: "Write a CER Paragraph", time: "8–10 min",
      goal: "Use your annotations to write a <b>Claim–Evidence–Reasoning</b> paragraph. Each box lights up when that part is strong.",
      prompt: "What would happen to life on Earth if photosynthesis suddenly stopped? Use evidence from the article.",
      parts: [
        { key: "claim", label: "Claim", sub: "Answer the question", starter: "If photosynthesis stopped, …",
          hint: "One sentence that directly answers the prompt.",
          checkLabel: "Claim answers the question (8+ words)",
          check: v => words(v) >= 8 && /photosynthesis|plants?/i.test(v) },
        { key: "evidence", label: "Evidence", sub: "Proof from the text", rows: 3, starter: "According to the article, …",
          hint: "Quote or paraphrase a <b>specific fact</b> from the article (the evidence you highlighted).",
          checkLabel: "Evidence cites the article with a specific fact",
          check: v => words(v) >= 12 && /article|text|author|according|["“]/i.test(v) && /oxygen|food chain|phytoplankton|half|glucose|fossil|gasoline|coal|sugar|ocean/i.test(v) },
        { key: "reasoning", label: "Reasoning", sub: "Why it proves your claim", rows: 3, starter: "This shows that … because …",
          hint: "Explain HOW your evidence proves your claim. Connect it to energy, food, or oxygen.",
          checkLabel: "Reasoning explains WHY (uses \"because\" or \"this shows\")",
          check: v => words(v) >= 15 && /because|this shows|this means|therefore|which means|so that/i.test(v) }
      ],
      minTerms: 3, minWords: 50,
      terms: [ ["photosynthesis", /photosynth/i], ["oxygen", /oxygen/i], ["glucose", /glucose/i], ["chlorophyll", /chlorophyll|chloroplast/i],
               ["carbon dioxide", /carbon dioxide|CO2|CO₂/i], ["food chain", /food chain|food web/i], ["phytoplankton", /phytoplankton/i], ["energy", /energy/i] ]
    },

    /* ---------- I: INQUIRY (prediction + simulation + graph) ---------- */
    I: {
      title: "Predict, Test & Graph", time: "10 min",
      goal: "Make a <b>prediction</b>, test it in a <b>virtual lab</b>, graph your data, and ask a <b>Level 3 question</b>.",
      html: `
        <div class="part"><h3><span class="n">1</span>Predict: How will LIGHT affect the rate of photosynthesis?</h3>
          <div class="choices" id="predChoices">
            <button class="choice" data-v="linear"><svg viewBox="0 0 120 70"><path d="M10 62 L110 62 M10 62 L10 6" stroke="#bbb" stroke-width="2"/><path d="M14 58 L106 12" stroke="#7b5cff" stroke-width="4" fill="none" stroke-linecap="round"/></svg>Keeps rising in a straight line</button>
            <button class="choice" data-v="plateau"><svg viewBox="0 0 120 70"><path d="M10 62 L110 62 M10 62 L10 6" stroke="#bbb" stroke-width="2"/><path d="M14 58 C 40 20, 55 16, 106 14" stroke="#7b5cff" stroke-width="4" fill="none" stroke-linecap="round"/></svg>Rises, then levels off</button>
            <button class="choice" data-v="down"><svg viewBox="0 0 120 70"><path d="M10 62 L110 62 M10 62 L10 6" stroke="#bbb" stroke-width="2"/><path d="M14 12 L106 56" stroke="#7b5cff" stroke-width="4" fill="none" stroke-linecap="round"/></svg>Goes down</button>
            <button class="choice" data-v="flat"><svg viewBox="0 0 120 70"><path d="M10 62 L110 62 M10 62 L10 6" stroke="#bbb" stroke-width="2"/><path d="M14 34 L106 34" stroke="#7b5cff" stroke-width="4" fill="none" stroke-linecap="round"/></svg>Stays the same</button>
          </div>
          <textarea class="box" rows="2" data-save="i-hyp" style="margin-top:12px" placeholder="If the light intensity increases, then the rate of photosynthesis will … because …"></textarea>
          <p class="hint">Write your hypothesis as <b>If… then… because…</b></p>
        </div>

        <div class="part"><h3><span class="n">2</span>Test it: Elodea Virtual Lab</h3>
          <p class="hint" style="margin-top:0">Elodea is a water plant. When it photosynthesizes, it releases bubbles of <b>oxygen</b>. Count the bubbles to measure the rate! Test <b>at least 5 different light levels</b> with the other settings kept the same.</p>
          <div class="lab">
            <div class="panel">
              <svg id="scene" viewBox="0 0 320 230" style="width:100%;display:block">
                <defs><radialGradient id="glow"><stop offset="0" stop-color="#ffe066"/><stop offset="1" stop-color="#ffe066" stop-opacity="0"/></radialGradient></defs>
                <circle id="glowC" cx="48" cy="70" r="70" fill="url(#glow)" opacity="0"/>
                <path d="M20 30 h40 l-6 30 h-28z" fill="#3a3f5c"/><rect x="36" y="10" width="8" height="22" fill="#3a3f5c"/>
                <circle id="bulb" cx="40" cy="66" r="12" fill="#ddd"/>
                <rect x="120" y="60" width="160" height="160" rx="10" fill="#e6f5ff" stroke="#8fb8d8" stroke-width="3"/>
                <rect x="123" y="78" width="154" height="139" rx="8" fill="#bfe3fa" opacity=".8"/>
                <g id="plant" stroke="#2f8f3a" stroke-width="3" fill="#43b04f">
                  <path d="M200 215 C 198 180, 205 150, 200 110" fill="none"/>
                  <ellipse cx="190" cy="190" rx="10" ry="4" transform="rotate(-30 190 190)"/><ellipse cx="211" cy="182" rx="10" ry="4" transform="rotate(30 211 182)"/>
                  <ellipse cx="191" cy="160" rx="10" ry="4" transform="rotate(-30 191 160)"/><ellipse cx="211" cy="150" rx="10" ry="4" transform="rotate(30 211 150)"/>
                  <ellipse cx="192" cy="128" rx="9" ry="4" transform="rotate(-30 192 128)"/><ellipse cx="208" cy="118" rx="9" ry="4" transform="rotate(30 208 118)"/>
                </g>
                <g id="bubbles"></g>
                <text x="200" y="52" text-anchor="middle" font-family="Nunito" font-weight="800" font-size="12" fill="#4f5677">beaker of water + elodea</text>
              </svg>
              <div class="control"><label>💡 Light intensity <span id="lightVal">50%</span></label><input type="range" id="light" min="0" max="100" step="5" value="50"></div>
              <div class="control"><label>🫧 Carbon dioxide (baking soda)</label><div class="seg" id="co2"><button data-v="low">Low</button><button data-v="high" class="on">High</button></div></div>
              <div class="control"><label>🌡️ Water temperature</label><div class="seg" id="temp"><button data-v="15">15 °C</button><button data-v="25" class="on">25 °C</button><button data-v="35">35 °C</button></div></div>
              <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px">
                <div><div class="hint" style="margin:0">O₂ bubbles per minute</div><div class="readout" id="rate">0</div></div>
                <button class="btn solid" id="record">📍 Record this trial</button>
              </div>
            </div>
            <div>
              <canvas class="graph" id="graph" height="260"></canvas>
              <div class="hint" id="legend"></div>
              <table class="data"><thead><tr><th>Trial</th><th>Light</th><th>CO₂</th><th>Temp</th><th>Bubbles/min</th></tr></thead><tbody id="rows"></tbody></table>
              <button class="btn" id="clearData" style="margin-top:8px;padding:6px 12px;font-size:.85rem">Clear data</button>
            </div>
          </div>
        </div>

        <div class="part"><h3><span class="n">3</span>Analyze & ask</h3>
          <label style="font-weight:800">Was your prediction supported?</label>
          <div class="seg" id="supported" style="margin:6px 0 10px"><button data-v="yes">Yes</button><button data-v="partly">Partly</button><button data-v="no">No</button></div>
          <textarea class="box" rows="3" data-save="i-analysis" placeholder="My graph shows that as light intensity increased, the rate… At about ___% light, … This is because…"></textarea>
          <p class="hint">Describe the <b>shape</b> of your graph and explain it using the term <b>limiting factor</b>.</p>
          <label style="font-weight:800;display:block;margin-top:12px">Write a Level 3 question you could test next (Costa's Levels):</label>
          <div class="stems"><button class="stem">What would happen if…</button><button class="stem">How would the results change if…</button><button class="stem">Predict what would happen to…</button><button class="stem">What might happen to a forest if…</button></div>
          <input class="box" data-save="i-q3" style="margin-top:8px" placeholder="What would happen if…?">
          <ul class="checks" id="iChecks">
            <li data-k="pred">Chose a prediction + wrote an If/then hypothesis</li>
            <li data-k="data">Recorded 5+ trials at different light levels (same CO₂ & temperature)</li>
            <li data-k="ana">Analyzed the graph (25+ words, uses "limiting factor")</li>
            <li data-k="q3">Wrote a Level 3 question</li>
          </ul>
        </div>`,

      /* the simulation: no need to edit unless you want to change the science model */
      mount(api) {
        const { root, state: S, save, complete, words } = api;
        const $ = s => root.querySelector(s);
        S.sim.trials = S.sim.trials || [];
        S.sim.co2 = S.sim.co2 || "high"; S.sim.temp = S.sim.temp || "25";
        if (S.sim.light === undefined) S.sim.light = 50;

        /* science model: light-saturation curve; CO2 raises the plateau; enzymes work best near 25 °C */
        const tempF = { "15": 0.55, "25": 1, "35": 0.75 };
        const model = (L, co2, t) => L === 0 ? 0 : (co2 === "high" ? 48 : 24) * (L / (L + 25)) * tempF[t];
        let current = 0;
        function measure() { const base = model(S.sim.light, S.sim.co2, S.sim.temp); return base === 0 ? 0 : Math.max(0, Math.round(base + (Math.random() * 3 - 1.5))); }

        // prediction choices + segmented controls
        function seg(id, key, store) {
          root.querySelectorAll(`#${id} button`).forEach(b => {
            b.classList.toggle("on", store[key] === b.dataset.v);
            b.onclick = () => { store[key] = b.dataset.v; save(); seg(id, key, store); refresh(); check(); };
          });
        }
        root.querySelectorAll("#predChoices .choice").forEach(b => {
          b.classList.toggle("on", S.inputs["i-pred"] === b.dataset.v);
          b.onclick = () => { S.inputs["i-pred"] = b.dataset.v; save(); root.querySelectorAll("#predChoices .choice").forEach(x => x.classList.toggle("on", x === b)); check(); };
        });
        seg("co2", "co2", S.sim); seg("temp", "temp", S.sim); seg("supported", "i-supported", S.inputs);

        const light = $("#light");
        light.value = S.sim.light;
        light.oninput = () => { S.sim.light = +light.value; save(); refresh(); };

        function refresh() {
          $("#lightVal").textContent = S.sim.light + "%";
          root.querySelector("#glowC").setAttribute("opacity", S.sim.light / 100);
          root.querySelector("#bulb").setAttribute("fill", S.sim.light ? `hsl(50, 100%, ${90 - S.sim.light * .3}%)` : "#ddd");
          current = measure(); $("#rate").textContent = current;
        }

        // bubble animation
        const g = root.querySelector("#bubbles"); let last = 0, acc = 0;
        const bubbles = [];
        function tick(t) {
          const dt = Math.min(.05, (t - last) / 1000 || 0); last = t;
          acc += dt * current / 60 * 4;  // shown 4x faster than real time
          while (acc >= 1) {
            acc -= 1;
            const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            const x = 188 + Math.random() * 26, y = 115 + Math.random() * 80;
            c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", 2 + Math.random() * 2.5);
            c.setAttribute("fill", "#fff"); c.setAttribute("stroke", "#7fb7e0"); c.setAttribute("stroke-width", "1");
            g.appendChild(c); bubbles.push({ c, x, y, v: 30 + Math.random() * 30 });
          }
          for (let i = bubbles.length - 1; i >= 0; i--) {
            const b = bubbles[i]; b.y -= b.v * dt; b.x += Math.sin(b.y / 8) * .3;
            b.c.setAttribute("cy", b.y); b.c.setAttribute("cx", b.x);
            if (b.y < 82) { b.c.remove(); bubbles.splice(i, 1); }
          }
          requestAnimationFrame(tick);
        }
        if (!matchMedia("(prefers-reduced-motion: reduce)").matches) requestAnimationFrame(tick);

        // data table + graph
        const COLORS = ["#7b5cff", "#e8573f", "#14a396", "#d08a00", "#0b6fb8", "#c2185b"];
        const condKey = t => `${t.co2 === "high" ? "High" : "Low"} CO₂, ${t.temp} °C`;
        function draw() {
          const tb = $("#rows");
          tb.innerHTML = S.sim.trials.map((t, i) => `<tr><td>${i + 1}</td><td>${t.light}%</td><td>${t.co2}</td><td>${t.temp} °C</td><td><b>${t.rate}</b></td></tr>`).join("");
          const cv = $("#graph"), dpr = window.devicePixelRatio || 1;
          const W = cv.clientWidth || 400, H = 260;
          cv.width = W * dpr; cv.height = H * dpr; cv.style.height = H + "px";
          const x = cv.getContext("2d"); x.scale(dpr, dpr); x.clearRect(0, 0, W, H);
          const pad = { l: 46, r: 14, t: 16, b: 40 }, pw = W - pad.l - pad.r, ph = H - pad.t - pad.b, yMax = 50;
          const X = v => pad.l + v / 100 * pw, Y = v => pad.t + ph - v / yMax * ph;
          x.strokeStyle = "#eee5d5"; x.lineWidth = 1; x.fillStyle = "#4f5677"; x.font = "11px Nunito, sans-serif"; x.textAlign = "center";
          for (let v = 0; v <= 100; v += 20) { x.beginPath(); x.moveTo(X(v), pad.t); x.lineTo(X(v), pad.t + ph); x.stroke(); x.fillText(v, X(v), pad.t + ph + 14); }
          x.textAlign = "right";
          for (let v = 0; v <= yMax; v += 10) { x.beginPath(); x.moveTo(pad.l, Y(v)); x.lineTo(pad.l + pw, Y(v)); x.stroke(); x.fillText(v, pad.l - 6, Y(v) + 4); }
          x.strokeStyle = "#1b1f3b"; x.lineWidth = 2; x.beginPath(); x.moveTo(pad.l, pad.t); x.lineTo(pad.l, pad.t + ph); x.lineTo(pad.l + pw, pad.t + ph); x.stroke();
          x.fillStyle = "#1b1f3b"; x.font = "bold 12px Nunito, sans-serif"; x.textAlign = "center";
          x.fillText("Light intensity (%)", pad.l + pw / 2, H - 6);
          x.save(); x.translate(12, pad.t + ph / 2); x.rotate(-Math.PI / 2); x.fillText("O₂ bubbles per minute", 0, 0); x.restore();
          const groups = {};
          S.sim.trials.forEach(t => (groups[condKey(t)] = groups[condKey(t)] || []).push(t));
          const legend = [];
          Object.keys(groups).forEach((k, gi) => {
            const col = COLORS[gi % COLORS.length], pts = groups[k].slice().sort((a, b) => a.light - b.light);
            legend.push(`<span style="color:${col};font-weight:800">● ${k}</span>`);
            x.strokeStyle = col; x.lineWidth = 2.5; x.beginPath(); pts.forEach((p, i) => i ? x.lineTo(X(p.light), Y(p.rate)) : x.moveTo(X(p.light), Y(p.rate))); x.stroke();
            x.fillStyle = col; pts.forEach(p => { x.beginPath(); x.arc(X(p.light), Y(p.rate), 5, 0, 7); x.fill(); });
          });
          $("#legend").innerHTML = legend.join(" &nbsp; ") || "Record trials to see your graph.";
        }
        $("#record").onclick = () => {
          S.sim.trials.push({ light: S.sim.light, co2: S.sim.co2, temp: S.sim.temp, rate: current });
          save(); draw(); check(); refresh();
        };
        $("#clearData").onclick = () => { if (confirm("Clear all recorded trials?")) { S.sim.trials = []; save(); draw(); check(); } };
        window.addEventListener("resize", draw);

        // stem buttons → question box
        root.querySelectorAll(".stem").forEach(b => b.onclick = () => {
          const inp = root.querySelector('[data-save="i-q3"]'); inp.value = b.textContent + " "; inp.focus();
          inp.dispatchEvent(new Event("input", { bubbles: true }));
        });

        function check() {
          const i = S.inputs;
          const groups = {};
          S.sim.trials.forEach(t => { const k = t.co2 + t.temp; (groups[k] = groups[k] || new Set()).add(t.light); });
          const r = {
            pred: !!i["i-pred"] && /\bif\b/i.test(i["i-hyp"] || "") && /\bthen\b/i.test(i["i-hyp"] || ""),
            data: Object.values(groups).some(s => s.size >= 5),
            ana: !!i["i-supported"] && words(i["i-analysis"] || "") >= 25 && /limiting factor/i.test(i["i-analysis"] || ""),
            q3: words(i["i-q3"] || "") >= 6 && /\?\s*$/.test(i["i-q3"] || "")
          };
          root.querySelectorAll("#iChecks li").forEach(li => li.classList.toggle("ok", r[li.dataset.k]));
          if (Object.values(r).every(Boolean)) complete("Inquiry complete!");
        }
        root.addEventListener("input", check);
        refresh(); setTimeout(() => { draw(); check(); }, 0);
        new IntersectionObserver(() => draw()).observe($("#graph"));
      }
    },

    /* ---------- C: COLLABORATION ---------- */
    C: {
      title: "Philosophical Chairs", time: "5–8 min",
      goal: "Take a position, back it up with <b>evidence from your lab</b>, and respond respectfully to a classmate's argument.",
      statement: "A greenhouse owner should keep her grow lights at maximum brightness, 24 hours a day, so her plants grow as fast as possible.",
      reasonStarter: "I agree / disagree because when I tested light in the simulation, I noticed…",
      peer: { name: "Maya", says: "More light always means more photosynthesis, so the brightest light all day and night is obviously the best choice." },
      frames: [ "I agree with ___ because…", "I respectfully disagree because the data showed…", "Can you clarify what you mean by…?",
                "I'd like to build on that idea…", "What evidence do you have that…?", "I used to think ___, but now I think…" ]
    },

    /* ---------- O: ORGANIZATION ---------- */
    O: {
      title: "Organize It", time: "5–8 min",
      goal: "Sort what you learned into a <b>graphic organizer</b>, then write a Cornell-notes-style <b>summary</b>.",
      sortTitle: "Photosynthesis graphic organizer",
      zones: [ "⬅️ Inputs (Reactants)", "➡️ Outputs (Products)", "📍 Where It Happens", "🎚️ What Controls the Rate" ],
      tiles: [ ["Carbon dioxide (CO₂)", 0], ["Water (H₂O)", 0], ["Light energy", 0],
               ["Glucose (C₆H₁₂O₆)", 1], ["Oxygen (O₂)", 1],
               ["Chloroplasts", 2], ["Chlorophyll", 2], ["Leaf cells", 2],
               ["Light intensity", 3], ["Temperature", 3], ["CO₂ concentration", 3] ],
      summaryPrompt: "Use your organizer to write a 2–3 sentence summary of photosynthesis, like the summary at the bottom of your Cornell notes.",
      summaryStarter: "Photosynthesis is the process where…"
    }
  }
};
function words(s) { return (String(s).trim().match(/[A-Za-z0-9'’%₂₆-]+/g) || []).length; }
</script>
<script src="hub-config.js?v=3"></script>
<script src="wicor-lesson.js?v=3"></script>
</body>
</html>
