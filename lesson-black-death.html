<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Black Death | WICOR World History</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="wicor-lesson.css">
</head>
<body>
<script>
/* =====================================================================
   ✏️ LESSON CONTENT: The Black Death (World History)
   In the article:  [C] = claim   [E] = evidence   [R] = reasoning
                    {{word}} = a key term students should circle
   ===================================================================== */
const FRAMES = [ "I agree with ___ because…", "I respectfully disagree because the evidence shows…", "Can you clarify what you mean by…?",
                 "I'd like to build on that idea…", "What evidence do you have that…?", "I used to think ___, but now I think…" ];
const LESSON = {
  id: "hist-black-death",
  subject: "World History",
  short: "World History: The Black Death",
  color: "#e0408a",
  emoji: "🏰",
  eq: "How can a single disaster change the way a society works?",
  targets: {"R": "I can identify the claim, evidence, and reasoning in a historical article about the Black Death.", "W": "I can write a CER paragraph arguing whether the Black Death was a turning point for ordinary people.", "I": "I can use a model to compare how quarantine affects the spread of disease.", "C": "I can use historical evidence to support my position and respond respectfully to a peer.", "O": "I can organize the causes, effects, and responses to the Black Death."},
  title: "The Plague That Remade Europe",
  intro: "How could a disease change who works, who rules, and how we fight sickness today? Read, write, model an outbreak, debate, and organize causes and effects. Five stations, about 5–10 minutes each.",
  order: ["R", "W", "I", "C", "O"],
  stations: {

    R: {
      title: "Read & Annotate", time: "8–10 min",
      goal: "Read the article and mark it up: underline the <b>claim</b>, highlight <b>evidence</b> and <b>reasoning</b>, circle <b>key terms</b>, and write at least one <b>margin note</b>.",
      minKeys: 4,
      gist: "In one sentence, what does the author want you to believe about the Black Death?",
      article: {
        title: "The Plague That Remade Europe",
        byline: "World History · AVID WICOR reading",
        paragraphs: [
          [ "In 1347, trading ships arrived in Sicily carrying sick sailors, and within a few years a deadly disease had swept across Europe.",
            "Historians call this {{pandemic}} the Black Death.",
            "[C] The Black Death changed medieval Europe more than any king or war, because the loss of so many people reshaped work, power, and public health." ],
          [ "The disease was caused by a bacterium carried by fleas that lived on rats, and it could also spread from person to person.",
            "Crowded cities, busy {{trade routes}}, and poor sanitation helped it travel quickly from port to port.",
            "Medieval doctors did not understand germs, so many people blamed bad air, punishment from God, or outsiders." ],
          [ "[E] Historians estimate that between one-third and one-half of Europe's population died between 1347 and 1351.",
            "[E] With so few workers left, surviving peasants demanded higher wages, and in 1351 England passed the {{Statute of Labourers}} in an attempt to keep wages at their old levels.",
            "[E] Anger over limits like these helped spark the Peasants' Revolt of 1381, a major uprising of ordinary people against the English government.",
            "[E] In 1377, the port of Ragusa required arriving travelers to wait 30 days before entering, and the waiting period later grew to forty days, or quaranta giorni in Italian, which gave us the word {{quarantine}}." ],
          [ "[R] When a society suddenly loses so many people, the survivors gain bargaining power, and the old rules about who works and who rules begin to crack.",
            "[R] In this way, a disease weakened {{feudalism}}, the system that had kept peasants tied to the land for centuries." ],
          [ "Today, public health experts still study the Black Death to understand how diseases spread and how communities can slow them down." ]
        ]
      }
    },

    W: {
      title: "Write a CER Paragraph", time: "8–10 min",
      goal: "Use your annotations to write a <b>Claim–Evidence–Reasoning</b> paragraph. Each box lights up when that part is strong.",
      prompt: "Was the Black Death only a disaster, or was it also a turning point for ordinary people in Europe? Use evidence from the article.",
      parts: [
        { key: "claim", label: "Claim", sub: "Answer the question", starter: "The Black Death was…",
          hint: "One sentence that takes a clear position.", checkLabel: "Claim answers the question (8+ words)",
          check: v => words(v) >= 8 && /black death|plague|pandemic/i.test(v) },
        { key: "evidence", label: "Evidence", sub: "Proof from the text", rows: 3, starter: "According to the article, …",
          hint: "Quote or paraphrase a <b>specific fact</b>: a date, a number, a law, or an event.",
          checkLabel: "Evidence cites the article with a specific fact",
          check: v => words(v) >= 12 && /article|text|author|according|historians|["“]/i.test(v) && /wage|statute|1351|1381|revolt|third|half|quarantine|forty|ragusa|1347/i.test(v) },
        { key: "reasoning", label: "Reasoning", sub: "Why it proves your claim", rows: 3, starter: "This shows that … because …",
          hint: "Explain HOW your evidence proves your claim. Think about power, work, and wages.",
          checkLabel: "Reasoning explains WHY (uses \"because\" or \"this shows\")",
          check: v => words(v) >= 15 && /because|this shows|this means|therefore|which means|so that/i.test(v) }
      ],
      minTerms: 3, minWords: 50,
      terms: [ ["pandemic", /pandemic/i], ["feudalism", /feudal/i], ["peasants", /peasant/i], ["wages", /wage/i],
               ["quarantine", /quarantin/i], ["trade", /trade/i], ["labor", /labou?r/i] ]
    },

    I: {
      title: "Predict, Model & Graph", time: "10 min",
      goal: "Make a <b>prediction</b>, run an <b>outbreak model</b>, compare graphs, and ask a <b>Level 3 question</b>.",
      predict: {
        q: "Predict: If a medieval town adds a 40-day quarantine, what will happen to the number of people sick at the same time?",
        placeholder: "If the town uses a quarantine, then the number of people sick at once will … because …",
        options: [
          { v: "lower", label: "Fewer people sick at once", d: "M14 58 Q 60 34 106 56" },
          { v: "same", label: "About the same", d: "M14 58 Q 50 0 106 56" },
          { v: "higher", label: "More people sick at once", d: "M14 58 Q 40 -24 106 58" },
          { v: "zero", label: "No one ever gets sick", d: "M14 58 L106 58" } ]
      },
      lab: {
        mode: "curve",
        title: "Test it: Medieval Town Outbreak Model",
        intro: "This is a <b>simplified model</b> of a town of 1,000 people, not real historical data. Change how crowded the market is and whether the town uses a quarantine, then click <b>Run</b>. Run <b>at least 2 different scenarios</b> and compare the curves.",
        controls: [
          { type: "range", id: "contacts", label: "🏪 Market crowding (contacts per day)", min: 1, max: 10, step: 1, value: 5, short: "Contacts" },
          { type: "seg", id: "q", label: "🚢 Quarantine for arriving ships & travelers", options: [["none", "No quarantine"], ["q40", "40-day quarantine"]], value: "none", short: "Quarantine",
            fmt: v => v === "q40" ? "40 days" : "None" } ],
        /* simple S-I-R model: susceptible → sick → recovered or died */
        curve(c) {
          const N = 1000, beta = c.contacts * 0.06 * (c.q === "q40" ? 0.4 : 1), gamma = 1 / 8;
          let S = N - 3, I = 3, R = 0; const pts = [[0, I]];
          for (let d = 1; d <= 150; d++) { const inf = beta * S * I / N, rec = gamma * I; S -= inf; I += inf - rec; R += rec; if (d % 2 === 0) pts.push([d, I]); }
          return pts;
        },
        summary(pts) {
          let peak = 0, day = 0; pts.forEach(([d, v]) => { if (v > peak) { peak = v; day = d; } });
          const p = Math.round(peak);
          return p <= 3 ? { text: "The outbreak never took off", short: "no outbreak" } : { text: `Peak: ${p} sick on day ${day}`, short: `${p} (day ${day})` };
        },
        summaryCol: "Peak sick",
        x: { label: "Days since first case", min: 0, max: 150, tick: 30 },
        y: { label: "People sick at the same time", min: 0, max: 600, tick: 100 },
        readout: "Model result",
        group: c => `${c.contacts} contacts/day, ${c.q === "q40" ? "quarantine" : "no quarantine"}`,
        need: { runs: 2 }, needLabel: "Ran 2+ scenarios with different settings",
        scene: `<svg viewBox="0 0 320 220" style="width:100%;display:block">
          <rect x="10" y="10" width="300" height="200" rx="14" fill="#f3ead8" stroke="#c9b48a" stroke-width="3"/>
          <path d="M10 150 Q 160 120 310 160" stroke="#9fc5e8" stroke-width="16" fill="none"/>
          <text x="40" y="176" font-family="Nunito" font-weight="800" font-size="11" fill="#5a7da0">harbor</text>
          <g id="town"></g>
          <text id="tlab" x="160" y="30" text-anchor="middle" font-family="Nunito" font-weight="800" font-size="13" fill="#5d6577"></text>
        </svg>`,
        draw(svg, c, res) {
          const g = svg.querySelector("#town");
          const pts = LESSON.stations.I.lab.curve(c); let peak = 0; pts.forEach(p => peak = Math.max(peak, p[1]));
          const sick = Math.round(peak / 10);
          let html = "";
          for (let i = 0; i < 100; i++) { const col = i % 20, row = Math.floor(i / 20); const x = 34 + col * 13, y = 50 + row * 18;
            html += `<rect x="${x}" y="${y}" width="10" height="10" rx="2" fill="${i < sick ? "#d9534f" : "#6bbf7a"}"/>`; }
          g.innerHTML = html;
          svg.querySelector("#tlab").textContent = `At the peak: ${Math.round(peak)} of 1,000 people sick (each square = 10 people)`;
        }
      },
      analyze: {
        placeholder: "When I added a quarantine, the peak of the curve… This shows that…",
        hint: "Compare your runs. Use the word <b>quarantine</b> and describe how the <b>peak</b> of the curve changed.",
        must: /quarantin/i, minWords: 25, checkLabel: "Compared runs (25+ words, uses \"quarantine\")",
        stems: [ "What would happen if…", "How might history have changed if…", "Why do you think medieval leaders…", "What if trade routes had…" ]
      }
    },

    C: {
      title: "Philosophical Chairs", time: "5–8 min",
      goal: "Take a position, back it up with <b>historical evidence</b>, and respond respectfully to a classmate's argument.",
      statement: "In the long run, the Black Death made life better for the peasants who survived it.",
      reasonStarter: "I agree / disagree because the article says…",
      peer: { name: "Diego", says: "There's no way a disease that killed up to half of Europe could ever make life better for anyone." },
      frames: FRAMES
    },

    O: {
      title: "Organize It", time: "5–8 min",
      goal: "Sort causes, effects, and responses into a <b>graphic organizer</b>, then write a <b>summary</b>.",
      sortTitle: "Black Death cause-and-effect organizer",
      zones: [ "🐀 Causes & Spread", "👥 Social Effects", "💰 Economic Effects", "🏛️ Responses" ],
      tiles: [ ["Fleas on rats", 0], ["Busy trade routes", 0], ["Crowded cities", 0],
               ["Millions of deaths", 1], ["Blaming outsiders", 1], ["Peasants' Revolt of 1381", 1],
               ["Labor shortage", 2], ["Higher wages for workers", 2],
               ["Quarantine of ships", 3], ["Statute of Labourers", 3] ],
      summaryPrompt: "Use your organizer to write a 2–3 sentence summary of how the Black Death changed Europe.",
      summaryStarter: "The Black Death spread because…"
    }
  }
};
function words(s) { return (String(s).trim().match(/[A-Za-z0-9'’%₂₆-]+/g) || []).length; }
</script>
<script src="hub-config.js?v=3"></script>
<script src="wicor-lesson.js?v=3"></script>
</body>
</html>
